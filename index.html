      if(redir){try{VFS.write(abs(redir.file),stripAnsi(data||''),redir.append)}catch(e){out(`zsh: ${e.message}: ${redir.file}\n`,'e');code=1}}
      else if(data)out(data);
      last=code;
    }
  }

  function complete(){
    const pos=inp.selectionStart, before=inp.value.slice(0,pos), m=/(\S*)$/.exec(before), word=m[1];
    const first=!/\s/.test(before.replace(/^\s+/,'').slice(0,before.replace(/^\s+/,'').length))||!before.trim().includes(' ');
    let cands=[], dirPart='', pref=word;
    if(first&&!word.includes('/'))cands=Object.keys(CMDS).filter(c=>c.startsWith(word)).sort();
    else{
      const i=word.lastIndexOf('/'); dirPart=i>=0?word.slice(0,i+1):''; pref=word.slice(i+1);
      try{cands=VFS.list(abs(dirPart||'.')).filter(([n])=>n.startsWith(pref)&&(pref.startsWith('.')||!n.startsWith('.'))).map(([n,nd])=>n+(nd.t==='d'?'/':''))}catch(e){return}
    }
    if(!cands.length)return;
    const esc_=s=>s.replace(/ /g,'\\ ');
    let common=cands[0]; cands.forEach(c=>{while(!c.startsWith(common))common=common.slice(0,-1)});
    const rep=(s,sp)=>{const nv=inp.value.slice(0,pos-word.length)+dirPart+esc_(s)+(sp?' ':'')+inp.value.slice(pos);inp.value=nv;const c=(pos-word.length+dirPart.length+esc_(s).length+(sp?1:0));inp.setSelectionRange(c,c)};
    if(cands.length===1)rep(cands[0],!cands[0].endsWith('/'));
    else if(common.length>pref.length)rep(common,false);
    else out(cands.map(c=>c.endsWith('/')?CL('1;34',c):c).join('  '));
  }

  inp.onkeydown=async e=>{
    if(busy){if(e.ctrlKey&&e.key==='c'){abort=true;e.preventDefault()}return}
    if(e.key==='Enter'){
      const v=inp.value; out(pr.textContent+v); inp.value='';
      if(v.trim()){hist.push(v);if(hist.length>200)hist.shift();store.set('thist',hist)} hi=hist.length;
      busy=true; abort=false; line.style.display='none';
      try{await run(v)}catch(er){out('zsh: '+er.message,'e')}
      busy=false; line.style.display='flex'; setPrompt(); inp.focus(); t.scrollTop=t.scrollHeight;
    }else if(e.key==='ArrowUp'){if(hi>0)inp.value=hist[--hi];e.preventDefault();setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length))}
    else if(e.key==='ArrowDown'){inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');e.preventDefault()}
    else if(e.key==='Tab'){e.preventDefault();complete()}
    else if(e.ctrlKey&&e.key==='l'){e.preventDefault();CMDS.clear()}
    else if(e.ctrlKey&&e.key==='c'){e.preventDefault();out(pr.textContent+inp.value+'^C');inp.value=''}
    else if(e.ctrlKey&&e.key==='u'){e.preventDefault();inp.value=''}
  };
  t.onclick=()=>{if(!getSelection().toString())inp.focus()};
  t.append(line);
  out('Ostatnie logowanie: '+new Date().toLocaleString('pl-PL')+' na ttys000','d');
  out('Wpisz help, aby zobaczyć polecenia. Spróbuj: ls, cd Documents, cat "Lista zakupów.txt", neofetch','d');
  setPrompt(); setTimeout(()=>inp.focus(),60);
}

const fileArt=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return[`hsl(${h} 80% 62%)`,`hsl(${(h+60)%360} 70% 38%)`]};
/* pliki audio z folderu (lista tworzona przez build.ps1 w src/b3-songs.js) */
const TRACKS=[...GEN,...((typeof SONGS!=='undefined'?SONGS:[]).map(s=>({name:s.name,artist:'Plik z folderu',file:s.file,art:fileArt(s.name)})))];
const MusicAudio=new Audio(); MusicAudio.preload='none';
const Music={playing:false,cur:null,step:0,next:0,start:0,elapsed:0,timer:null,analyser:null,node:null,bus:null,shuffle:false,repeat:false};
/* utwory generowane grają przez osobny kanał, który można natychmiast wyciszyć (inaczej zaplanowane dźwięki dogrywałyby się jeszcze kilka sekund po zatrzymaniu) */
function musicCut(){const b=Music.bus;Music.bus=null;if(b&&AC){try{b.gain.cancelScheduledValues(AC.currentTime);b.gain.setTargetAtTime(0,AC.currentTime,.015)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},300)}}
function musicBus(){musicCut();Music.bus=AC.createGain();Music.bus.connect(master);return Music.bus}
const musicFreq=(deg,tr,oct=0)=>{const s=tr.scale,o=Math.floor(deg/s.length),i=((deg%s.length)+s.length)%s.length;return 440*Math.pow(2,(tr.root+s[i]+12*(o+oct)-69)/12)};
const musicDur=()=>{const tr=TRACKS[Music.cur];return tr&&tr.file?(MusicAudio.duration||0):180};
function musicPos(){const tr=TRACKS[Music.cur];if(tr&&tr.file)return MusicAudio.currentTime||0;return(Music.elapsed+(Music.playing?Date.now()-Music.start:0))/1000}
function musicSchedule(){
  const tr=TRACKS[Music.cur]; if(!AC||!Music.playing||!tr||tr.file)return; const spb=60/tr.bpm/2;
  while(Music.next<AC.currentTime+.3){
    const i=Music.step, t=Music.next, d=tr.pat[i%tr.pat.length];
    if(d!==null)tone(musicFreq(d,tr),t,spb*1.9,tr.wave,tr.vol,undefined,Music.bus);
    if(i%8===0)tone(musicFreq(tr.bass[(i/8)%tr.bass.length|0],tr,-1),t,spb*7.5,'sine',.13,undefined,Music.bus);
    if(i%16===0)[0,2,4].forEach(k=>tone(musicFreq(k+tr.bass[(i/16)%tr.bass.length|0],tr,0),t,spb*15,'sine',.03,undefined,Music.bus));
    if(tr.noise&&i%2===0)noiseBurst(t,spb*.9,.03,Music.bus);
    Music.next+=spb; Music.step++;
  }
  if(musicPos()>=180)musicEnded();
}
function musicPlay(i){
  const tr=TRACKS[i]; if(!tr||!ac())return;
  clearInterval(Music.timer); musicCut(); MusicAudio.pause(); Music.cur=i; Music.elapsed=0; Music.start=Date.now(); Music.playing=true;
  if(!Music.analyser){Music.analyser=AC.createAnalyser();Music.analyser.fftSize=64;master.connect(Music.analyser)}
  if(tr.file){
    /* przez graf audio tylko na http(s): z file:// przeglądarka wyciszyłaby dźwięk */
    if(!Music.node&&location.protocol.startsWith('http')){try{Music.node=AC.createMediaElementSource(MusicAudio);Music.node.connect(master)}catch(e){}}
    MusicAudio.volume=Music.node?1:S.volume/100; MusicAudio.src=encodeURI(tr.file); MusicAudio.load();
    const p=MusicAudio.play(); if(p&&p.catch)p.catch(()=>{Music.playing=false;notify('Muzyka','Nie można odtworzyć pliku „'+tr.file+'”.','music');emit('music')});
  }else{musicBus();Music.step=0;Music.next=AC.currentTime+.06;Music.timer=setInterval(musicSchedule,100)}
  emit('music');
}
function musicToggle(){
  if(Music.cur==null)return musicPlay(0);
  const tr=TRACKS[Music.cur];
  if(Music.playing){if(tr.file)MusicAudio.pause();else{Music.elapsed+=Date.now()-Music.start;clearInterval(Music.timer);musicCut()}Music.playing=false}
  else if(ac()){if(tr.file){const p=MusicAudio.play();if(p&&p.catch)p.catch(()=>{})}else{musicBus();Music.start=Date.now();Music.next=AC.currentTime+.06;Music.timer=setInterval(musicSchedule,100)}Music.playing=true}
  emit('music');
}
function musicNext(){
  const n=TRACKS.length;
  if(Music.shuffle&&n>1){let k;do{k=Math.random()*n|0}while(k===Music.cur);return musicPlay(k)}
  musicPlay(((Music.cur??-1)+1)%n);
}
const musicPrev=()=>musicPlay(((Music.cur??1)-1+TRACKS.length)%TRACKS.length);
const musicEnded=()=>Music.repeat&&Music.cur!=null?musicPlay(Music.cur):musicNext();
function musicStop(){clearInterval(Music.timer);musicCut();MusicAudio.pause();Music.playing=false;Music.cur=null;Music.elapsed=0;emit('music')}

MusicAudio.addEventListener('error',()=>{const tr=TRACKS[Music.cur];if(tr&&tr.file&&Music.playing){Music.playing=false;notify('Muzyka','Nie można odtworzyć pliku „'+tr.file+'”.','music');emit('music')}});

      $('#sws',view).onclick=()=>{if(sw.run){sw.acc+=Date.now()-sw.t0;sw.run=false}else{sw.t0=Date.now();sw.run=true}draw()};
      $('#swl',view).onclick=()=>{if(sw.run){sw.laps.unshift(sw.acc+Date.now()-sw.t0)}else{sw={run:false,t0:0,acc:0,laps:[]}}draw()};
    }else{

      $('#tmg',view).onclick=()=>{if(tm.run){tm.left=tm.end-Date.now();tm.run=false}else{if(tm.left<=0||!tm.touched){tm.left=(+$('#tmm',view).value*60+ +$('#tms',view).value)*1000}tm.touched=true;tm.end=Date.now()+tm.left;tm.run=true}draw()};
      $('#tmr',view).onclick=()=>{tm={run:false,end:0,left:(+$('#tmm',view).value*60+ +$('#tms',view).value)*1000,touched:false};draw()};
    }

  }

    if(tab==='stop'){const t=$('#swt',view);if(!t)return;t.textContent=fmt(sw.acc+(sw.run?Date.now()-sw.t0:0));$('#sws',view).textContent=sw.run?'Stop':'Start';$('#swl',view).textContent=sw.run?'Okrążenie':'Resetuj';$('#swlaps',view).innerHTML=sw.laps.map((l,i)=>`<div class="row"><span>Okrążenie ${sw.laps.length-i}</span><span style="font-variant-numeric:tabular-nums">${fmt(l)}</span></div>`).join('')}
    if(tab==='timer'){const t=$('#tmt',view);if(!t)return;let left=tm.run?tm.end-Date.now():tm.left;if(tm.run&&left<=0){tm.run=false;tm.left=0;left=0;sfx('notify');notify('Minutnik','Czas minął.','clock');draw();return}t.textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left/1000)%60);$('#tmg',view).textContent=tm.run?'Pauza':'Start'}
    if(tab==='world'&&view.firstChild&&view.firstChild.tagName==='svg'){view.firstChild.outerHTML=analog()}
  }
  const iv=setInterval(()=>{if(tab==='world'&&new Date().getSeconds()===0)draw();else tickv()},tab==='stop'?40:250); const iv2=setInterval(tickv,50);
  w.cleanups.push(()=>{clearInterval(iv);clearInterval(iv2)}); draw();
}

function renderCalendar(body,w){
  const ev=store.get('cal',{}); let d=new Date(); d.setDate(1); let selD=new Date();

  function draw(){
    const now=new Date(), y=d.getFullYear(), mo=d.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), prev=new Date(y,mo,0).getDate();
    m.innerHTML='<div class="cal-h"><h2></h2><button aria-label="Poprzedni miesiąc">‹</button><button>Dziś</button><button aria-label="Następny miesiąc">›</button></div><div class="cal-g"></div>';
    $('h2',m).textContent=d.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
    const g=$('.cal-g',m); ['pon','wt','śr','czw','pt','sob','niedz'].forEach(x=>g.append(el('div','wd',x)));
    for(let i=0;i<42;i++){
      const n=i-first+1, o=n<1||n>days, v=n<1?prev+n:n>days?n-days:n, dt=new Date(y,mo+(n<1?-1:n>days?1:0),v);
      const c=el('div',(o?'o ':'')+(key(dt)===key(now)?'t ':'')+(key(dt)===key(selD)?'s':''),'<span>'+v+'</span>');
      (ev[key(dt)]||[]).slice(0,2).forEach(t=>{const q=el('i');q.textContent=t;c.append(q)});
      c.onclick=()=>{selD=dt;draw()}; g.append(c);
    }
    const b=$$('.cal-h button',m); b[0].onclick=()=>{d.setMonth(mo-1);draw()}; b[1].onclick=()=>{d=new Date();d.setDate(1);selD=new Date();draw()}; b[2].onclick=()=>{d.setMonth(mo+1);draw()};
    const k=key(selD); sd.innerHTML=`<div style="font-weight:700;font-size:15px;text-transform:capitalize"></div><div style="color:var(--fg2);margin-bottom:10px"></div><div id="evl"></div><button class="btn p" style="margin-top:10px;width:100%">Dodaj wydarzenie</button>`;
    sd.children[0].textContent=selD.toLocaleDateString('pl-PL',{weekday:'long'}); sd.children[1].textContent=selD.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
    const l=$('#evl',sd); (ev[k]||[]).forEach((t,idx)=>{const r=el('div','nrow','<span style="flex:1;color:var(--fg)"></span><button class="tbtn" aria-label="Usuń">×</button>');$('span',r).textContent=t;$('button',r).onclick=()=>{ev[k].splice(idx,1);store.set('cal',ev);draw()};l.append(r)});
    if(!(ev[k]||[]).length)l.append(el('div','',"<span style='color:var(--fg2)'>Brak wydarzeń</span>"));
    $('button',sd).onclick=()=>dialog({title:'Nowe wydarzenie',msg:selD.toLocaleDateString('pl-PL',{day:'numeric',month:'long'}),input:'Nazwa wydarzenia',buttons:[{label:'Anuluj',cancel:true},{label:'Dodaj',primary:true,cb:v=>{v=(v||'').trim();if(!v)return false;(ev[k]=ev[k]||[]).push(v);store.set('cal',ev);draw()}}]});
  }
  w&&w.on('cal',()=>{Object.assign(ev,store.get('cal',{}));draw()});
  draw();

/* ================= KALKULATOR ================= */
function renderCalc(body){
  const wrap=el('div','calc'), scr_=el('div','scr','0'), keys=el('div','keys'); wrap.append(scr_,keys); body.append(wrap);
  let cur_='0',prev=null,op=null,fresh=false;
  const layout=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],'7','8','9',['×','op'],'4','5','6',['−','op'],'1','2','3',['+','op'],['0','z'],',',['=','op']];
  const fmt=s=>{if(s==='Błąd')return s;const[i,d]=s.split('.');return(+i).toLocaleString('pl-PL')+(d!=null?','+d:'')};
  const show=()=>{const t=fmt(cur_);scr_.textContent=t;scr_.style.fontSize=t.length>9?'28px':t.length>6?'36px':'44px'};
  const calc=()=>{const a=prev,b=parseFloat(cur_);const r=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:b===0?NaN:a/b;return isFinite(r)?String(+r.toPrecision(12)):'Błąd'};
  const btns={};
  layout.forEach(k=>{
    const[t,c]=Array.isArray(k)?k:[k,''], b=el('button',c,t); btns[t]=b; keys.append(b);
    b.onclick=()=>{
      if(/\d/.test(t)){cur_=(fresh||cur_==='0')?t:(cur_.length<12?cur_+t:cur_);fresh=false}
      else if(t===','){if(fresh){cur_='0';fresh=false}if(!cur_.includes('.'))cur_+='.'}
      else if(t==='AC'){cur_='0';prev=null;op=null;fresh=false}
      else if(t==='±'){cur_=String(-parseFloat(cur_)||0)}
      else if(t==='%'){cur_=String(+(parseFloat(cur_)/100).toPrecision(12))}
      else if(t==='='){if(op&&prev!=null){cur_=calc();op=null;prev=null;fresh=true}}
      else{if(op&&!fresh&&prev!=null)cur_=calc();prev=parseFloat(cur_);op=t;fresh=true}
      Object.entries(btns).forEach(([k2,x])=>x.classList.toggle('on',k2===op&&fresh));
      btns.AC.textContent=cur_==='0'&&!op?'AC':'C'; show();
    };
  });
  show();
}

/* pobieranie z paskiem postępu w docku (używa tego App Store i Miri) */
function downloadApp(id){
  if(dl[id]!=null||S.installed.includes(id)||!APPS[id])return false;
  dl[id]=0; sfx('click'); refreshDock(); emit('storeprog');
  const iv=setInterval(()=>{dl[id]+=.035+Math.random()*.05;if(dl[id]>=1){clearInterval(iv);delete dl[id];installApp(id)}else dockProgress(id,dl[id]);emit('storeprog')},150);
  return true;
}
function installApp(id){
  if(S.installed.includes(id))return;
  S.installed.push(id); saveS(); VFS.syncApps(); refreshDock(); emit('store');
  notify('Zainstalowano „'+APPS[id].name+'”','Aplikacja jest gotowa. Znajdziesz ją w Launchpadzie i w docku.',id);
}
function uninstallApp(id){
  winsOf(id).forEach(closeWin); S.installed=S.installed.filter(i=>i!==id); saveS(); VFS.syncApps(); refreshDock(); emit('store');
  notify('Usunięto „'+APPS[id].name+'”','Aplikacja została odinstalowana.','appstore');
}

/* ---------- Saper ---------- */
function renderMines(body,w){
  const R=9,C=9,M=10; let cells,over,won,first,flagsN,flagMode=false,secs,tm;
  const main=el('div','main'), bar=el('div','bar'), grid=el('div','mine-g'); grid.style.cssText=`grid-template-columns:repeat(${C},28px);margin:10px auto;width:max-content`;
  const mc=el('b'), face=el('button','','Nowa gra'), tt=el('b'), fm=el('button','','Flaga: wył.');
  bar.append(mc,el('span','sp'),face,el('span','sp'),tt); const bar2=el('div','bar'); bar2.append(fm); main.append(bar,grid,bar2); body.append(main);
  const COL=['','#0a84ff','#28a745','#ff3b30','#5e35b1','#a52a2a','#00897b','#000','#777'];
  const nb=(r,c)=>{const o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if((a||b)&&r+a>=0&&r+a<R&&c+b>=0&&c+b<C)o.push([r+a,c+b])}return o};
  function reset(){cells=Array.from({length:R},()=>Array.from({length:C},()=>({m:false,o:false,f:false,n:0})));over=won=false;first=true;flagsN=0;secs=0;clearInterval(tm);draw()}
  function place(sr,sc){let k=0;while(k<M){const r=Math.random()*R|0,c=Math.random()*C|0;if(cells[r][c].m||(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1))continue;cells[r][c].m=true;k++}
    for(let r=0;r<R;r++)for(let c=0;c<C;c++)cells[r][c].n=nb(r,c).filter(([a,b])=>cells[a][b].m).length;
    tm=setInterval(()=>{secs++;tt.textContent=pad(Math.floor(secs/60))+':'+pad(secs%60)},1000)}
  function flood(r,c){const q=[[r,c]];while(q.length){const[a,b]=q.pop(),x=cells[a][b];if(x.o||x.f)continue;x.o=true;if(x.n===0)nb(a,b).forEach(p=>q.push(p))}}
  function dig(r,c){
    if(over||won)return; const x=cells[r][c]; if(x.f||x.o)return;
    if(first){place(r,c);first=false}
    if(x.m){over=true;clearInterval(tm);cells.forEach(row=>row.forEach(y=>{if(y.m)y.o=true}));sfx('error');draw();return}
    flood(r,c);
    if(cells.every(row=>row.every(y=>y.m||y.o))){won=true;clearInterval(tm);sfx('notify')}
    draw();
  }
  function flag(r,c){if(over||won||cells[r][c].o)return;const x=cells[r][c];x.f=!x.f;flagsN+=x.f?1:-1;draw()}
  function draw(){
    grid.innerHTML=''; mc.textContent='Miny: '+(M-flagsN); tt.textContent=pad(Math.floor(secs/60))+':'+pad(secs%60); fm.textContent=flagMode?'Flaga: wł.':'Flaga: wył.'; fm.classList.toggle('on',flagMode);
    cells.forEach((row,r)=>row.forEach((x,c)=>{
      const d=el('div','mcell'+(x.o?' o':'')); if(x.o){if(x.m){d.textContent='✱';d.style.color='#ff3b30'}else if(x.n){d.textContent=x.n;d.style.color=COL[x.n]}}else if(x.f){d.textContent='⚑';d.style.color='#ff9f0a'}
      d.onclick=()=>flagMode?flag(r,c):dig(r,c); d.oncontextmenu=e=>{e.preventDefault();flag(r,c)}; grid.append(d);
    }));
    $('.msg',body)&&$('.msg',body).remove();
    if(over||won){const m=el('div','msg',`<div>${won?'Wygrana!':'Koniec gry'}</div>`);const b=el('button','btn p','Zagraj ponownie');b.onclick=reset;m.append(b);body.append(m)}
  }
  face.onclick=reset; fm.onclick=()=>{flagMode=!flagMode;draw()}; w.cleanups.push(()=>clearInterval(tm)); reset();
}

  const addT=()=>{const e=[];g.forEach((r,i)=>r.forEach((v,j)=>{if(!v)e.push([i,j])}));if(e.length){const[i,j]=e[Math.random()*e.length|0];g[i][j]=Math.random()<.9?2:4}};
  function reset(){g=Array.from({length:4},()=>[0,0,0,0]);score=0;over=false;addT();addT();draw()}
  const slide=row=>{const a=row.filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);score+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o};
  const T=m=>m[0].map((_,i)=>m.map(r=>r[i]));
  function move(d){
    if(over)return; const before=JSON.stringify(g); let m=g.map(r=>r.slice());
    if(d==='u'||d==='d')m=T(m); if(d==='r'||d==='d')m=m.map(r=>r.reverse());
    m=m.map(slide);
    if(d==='r'||d==='d')m=m.map(r=>r.reverse()); if(d==='u'||d==='d')m=T(m);

  }
  const keyh=e=>{if(!w.el.classList.contains('front')||$('.dlg'))return;const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k){e.preventDefault();move(k)}};

/* ---------- Wąż ---------- */
function renderSnake(body,w){
  const N=18,Z=20; let sn,dir,nd,food,score,best=store.get('bsnake',0),state='ready',tm;
  const main=el('div','main'), bar=el('div','bar'), cv=el('canvas'), sc=el('b'), bs=el('b');
  cv.width=cv.height=N*Z; cv.style.cssText='width:min(360px,calc(100% - 20px));aspect-ratio:1;margin:12px auto;border-radius:8px;touch-action:none;display:block;flex:none'; bar.append(sc,el('span','sp'),bs); main.append(bar,cv); body.append(main);
  const g=cv.getContext('2d');
  function reset(){sn=[[9,9],[8,9],[7,9]];dir=nd=[1,0];score=0;spawn();state='ready';draw();clearInterval(tm)}
  function spawn(){do{food=[Math.random()*N|0,Math.random()*N|0]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))}
  function start(){if(state==='run')return;state='run';clearInterval(tm);tm=setInterval(step,115)}
  function step(){
    dir=nd; const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){state='over';clearInterval(tm);if(score>best){best=score;store.set('bsnake',best)}sfx('error');draw();return}
    sn.unshift(h); if(h[0]===food[0]&&h[1]===food[1]){score++;sfx('click');spawn()}else sn.pop(); draw();
  }
  function draw(){
    sc.textContent='Wynik: '+score; bs.textContent='Rekord: '+best;
    g.fillStyle='#16271c'; g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle='rgba(255,255,255,.04)'; for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*Z,j*Z,Z,Z);
    g.fillStyle='#ff5f57'; g.beginPath(); g.arc(food[0]*Z+Z/2,food[1]*Z+Z/2,Z/2-3,0,7); g.fill();
    sn.forEach((s,i)=>{g.fillStyle=i?'#7fe08a':'#c8ffd0';g.beginPath();g.roundRect(s[0]*Z+1,s[1]*Z+1,Z-2,Z-2,5);g.fill()});
    if(state!=='run'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#fff';g.textAlign='center';g.font='700 22px system-ui,sans-serif';g.fillText(state==='over'?'Koniec gry':'Wąż',cv.width/2,cv.height/2-8);g.font='14px system-ui,sans-serif';g.fillText(state==='over'?'Naciśnij strzałkę, aby zagrać ponownie':'Naciśnij strzałkę, aby zacząć',cv.width/2,cv.height/2+16)}
  }
  const turn=d=>{if(state==='over')reset();if(d[0]+dir[0]===0&&d[1]+dir[1]===0)return;nd=d;start()};
  const keyh=e=>{if(!w.el.classList.contains('front')||$('.dlg'))return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m){e.preventDefault();turn(m)}};
  addEventListener('keydown',keyh); w.cleanups.push(()=>{removeEventListener('keydown',keyh);clearInterval(tm)});
  let sx,sy; cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  cv.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1])});
  reset();
}

function drawOrb(ctx,W,H,t,level,state){

const appListText=()=>[...BASE_APPS,...S.installed].filter(i=>APPS[i]&&!APPS[i].special).slice(0,8).map(i=>APPS[i].name).join(', ');

/* Wspólny wykonawca: to samo wywołują umiejętności lokalne i narzędzia AI. Zwraca prawdziwy wynik. */
function miriDo(name,inp){
  inp=inp||{};
  switch(name){
    case 'open_app':{
      const id=resolveApp(inp.app); if(!id||!APPS[id])return failR('Nie znam aplikacji „'+String(inp.app||'').slice(0,40)+'”.');
      if(!appAvail(id)){openApp('appstore');return failR('Aplikacja '+APPS[id].name+' nie jest jeszcze pobrana. Otwieram App Store, tam ją pobierzesz.')}
      openApp(id); return okR('Otwieram '+APPS[id].name+'.');
    }
    case 'close_app':{
      if(miriNorm(String(inp.app||'')).trim()==='all'||/wszystk/.test(miriNorm(String(inp.app||'')))){if(!wins.size)return failR('Nie ma otwartych okien.');closeAll();return okR('Zamykam wszystkie okna.')}
      const id=resolveApp(inp.app); if(!id)return failR('Nie znam aplikacji „'+String(inp.app||'').slice(0,40)+'”.');
      if(!winsOf(id).length)return failR(APPS[id].name+' nie jest otwarte.');
      winsOf(id).forEach(closeWin); return okR('Zamykam '+APPS[id].name+'.');
    }
    case 'create_note':{
      const t=String(inp.text||'').trim(); if(!t)return failR('Nie usłyszałam treści notatki.');
      const notes=store.get('notes',[]); notes.unshift({id:Date.now(),t}); store.set('notes',notes); emit('notes');
      return okR('Zapisałam notatkę: '+t.slice(0,80)+'.');
    }
    case 'add_reminder':{
      const t=String(inp.text||'').trim(); if(!t)return failR('Nie usłyszałam treści przypomnienia.');
      const D=store.get('rem',null)||{lists:[{id:'a',name:'Przypomnienia',color:'#0a84ff'},{id:'b',name:'Zakupy',color:'#ff9f0a'},{id:'c',name:'Praca',color:'#30d158'}],items:[]};
      D.items.push({id:Date.now(),list:D.lists[0].id,text:t,done:false}); store.set('rem',D); emit('rem');
      return okR('Dodałam przypomnienie: '+t.slice(0,80)+'.');
    }
    case 'set_timer':{
      const s=Math.round(+inp.seconds); if(!s||s<1||s>86400)return failR('Podaj czas minutnika od 1 sekundy do 24 godzin.');
      const lab=String(inp.label||'').slice(0,60);
      setTimeout(()=>{sfx('notify');notify('Minutnik',lab?lab+': czas minął.':'Czas minął ('+durText(s)+').','clock');miriSpeak(lab?'Czas minął: '+lab+'.':'Czas minął.')},s*1000);
      return okR('Minutnik ustawiony na '+durText(s)+(lab?' ('+lab+')':'')+'.');
    }
    case 'music':{
      const a=inp.action||'play';
      if(a==='pause'||a==='stop'){if(Music.playing||Music.cur!=null){musicStop();return okR('Zatrzymałam muzykę.')}return failR('Muzyka teraz nie gra.')}
      if(a==='next'){musicNext();return okR('Następny utwór: '+TRACKS[Music.cur].name+'.')}
      if(a==='previous'){musicPrev();return okR('Poprzedni utwór: '+TRACKS[Music.cur].name+'.')}
      const q=miriNorm(String(inp.query||'')).trim();
      if(q.length>=2){
        const i=TRACKS.findIndex(t=>(!t.file||t.ok!==false)&&miriNorm(t.name).includes(q));
        if(i<0)return failR('Nie mam utworu „'+String(inp.query).slice(0,40)+'”.');
        musicPlay(i); return okR('Gram: '+TRACKS[i].name+'.');
      }
      if(Music.cur==null)musicPlay(Math.random()*GEN.length|0);else if(!Music.playing)musicToggle();
      return okR('Gram: '+TRACKS[Music.cur].name+'.');
    }
    case 'set_theme':{inp.mode==='light'?setTheme('light'):setTheme('dark');return okR(inp.mode==='light'?'Włączam tryb jasny.':'Włączam tryb ciemny.')}
    case 'set_wallpaper':{
      const list=WALLS.filter(x=>x.id!=='custom');
      const q=miriNorm(String(inp.name||'')).trim(); let w=q.length>2?list.find(x=>miriNorm(x.name).includes(q)||q.includes(miriNorm(x.name))):null;
      if(!w&&(inp.next||!q)){const i=list.findIndex(x=>x.id===S.wall);w=list[(i+1)%list.length]}
      if(!w)return failR('Nie mam tapety „'+String(inp.name).slice(0,30)+'”.');
      S.wall=w.id; saveS(); applyWall(); return okR('Ustawiam tapetę „'+w.name+'”.');
    }
    case 'set_volume':{
      const v=Math.max(0,Math.min(100,Math.round(+inp.level))); if(isNaN(v))return failR('Podaj głośność od 0 do 100.');
      S.volume=v; saveS(); applySettings(); return okR('Głośność ustawiona na '+v+' procent.');
    }
    case 'open_url':{
      let u=String(inp.url||'').trim(); if(!/^[\w.-]+\.[a-z]{2,}/i.test(u)&&!/^https?:\/\//i.test(u))return failR('To nie wygląda na adres strony.');
      if(!/^https?:\/\//i.test(u))u='https://'+u;
      openApp('browser',{url:u}); return okR('Otwieram '+u.replace(/^https?:\/\//,'').slice(0,60)+' w przeglądarce.');
    }
    case 'web_search':{
      const q=String(inp.query||'').trim(); if(!q)return failR('Nie usłyszałam, czego szukać.');
      openApp('browser',{url:'https://duckduckgo.com/?q='+encodeURIComponent(q)}); return okR('Wyszukuję „'+q.slice(0,60)+'” w przeglądarce.');
    }
    case 'install_app':{
      const id=resolveApp(inp.app); const st=id&&STORE.find(s=>s.id===id);
      if(!st)return failR('Nie mam takiej aplikacji w App Store.');
      if(S.installed.includes(id))return failR(st.name+' jest już pobrana.');
      if(dl[id]!=null)return failR(st.name+' już się pobiera.');
      downloadApp(id); return okR('Pobieram '+st.name+'. Postęp widać w docku.');
    }
    case 'uninstall_app':{
      const id=resolveApp(inp.app); if(!id||!S.installed.includes(id))return failR('Taka aplikacja nie jest pobrana.');
      const nm=APPS[id].name; uninstallApp(id); return okR('Odinstalowałam '+nm+'.');
    }
    case 'system':{
      const a=inp.action;
      if(a==='shutdown'){confirmPower('shutdown');return okR('Potwierdź wyłączenie w oknie dialogowym.')}
      if(a==='restart'){confirmPower('restart');return okR('Potwierdź restart w oknie dialogowym.')}
      if(a==='sleep'){setTimeout(sleepNow,1400);return okR('Usypiam komputer.')}
      if(a==='lock'){setTimeout(login,1200);return okR('Blokuję ekran.')}
      if(a==='fullscreen'){toggleFullscreen();return okR('Przełączam pełny ekran.')}
      return failR('Nie znam takiej akcji systemowej.');
    }
    case 'calendar_event':{
      const d=String(inp.date||''), t=String(inp.title||'').trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!t)return failR('Podaj datę i nazwę wydarzenia.');
      const ev=store.get('cal',{}); (ev[d]=ev[d]||[]).push(t); store.set('cal',ev); emit('cal');
      return okR('Dodałam wydarzenie „'+t.slice(0,50)+'” na '+new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long'})+'.');
    }
    case 'create_folder':{
      const nm=String(inp.name||'').trim().replace(/[\/\\]/g,'-'); if(!nm)return failR('Nie usłyszałam nazwy folderu.');
      try{VFS.mkdir(HOME+'/Desktop/'+nm)}catch(e){return failR('Nie mogę utworzyć folderu: '+e.message+'.')}
      return okR('Utworzyłam folder „'+nm+'” na pulpicie.');
    }
  }
  return failR('Nie znam polecenia „'+name+'”.');
}
const GATE={music:/muzyk|piosenk|utwor|kawalek|zagraj|odtworz|pusc|graj|pauz|wstrzymaj|nastepn|poprzedn|dalej|stop|play|music/,system:/komputer|uspij|zablokuj|restart|wylacz|zrestartuj|ekran|system/,uninstall_app:/odinstaluj|usun|skasuj/,install_app:/pobierz|zainstaluj|sciagnij|dodaj|zdobadz/,close_app:/zamknij|zamkn|zakoncz|wylacz|zgas/,set_theme:/tryb|motyw|ciemn|jasn|nocn|dzienn/,set_wallpaper:/tapet|tlo|wallpaper/,set_volume:/glosn|cisz|dzwiek|wycisz|volume/,calendar_event:/wydarzen|kalendarz|spotkan|termin|umow/};
function gateOk(a,text){const g=GATE[a.name];if(!g)return true;const n=miriNorm(text||'');return g.test(n)||(a.name==='music'&&TRACKS.some(t=>n.includes(miriNorm(t.name))))}
function miriSummary(acts,text){const ok=acts.filter(a=>gateOk(a,text));if(!ok.length)return null;return ok.map(a=>{try{return miriDo(a.name,a.input).msg}catch(e){return 'Nie udało się wykonać polecenia.'}}).join(' ')}

/* dopytywanie: gdy brakuje szczegółu, Miri pyta i traktuje następną wypowiedź jako odpowiedź */
function ask(type,q,extra){MiriS.pending=Object.assign({type,t:Date.now(),tries:0},extra||{});return q}
function pendingHandle(p,text,n,raw){
  switch(p.type){
    case 'open_app':case 'close_app':{
      const r=miriDo(p.type,{app:text}); if(!r.ok&&/Nie znam/.test(r.msg)&&p.tries<1)return ask(p.type,'Nie znam takiej aplikacji. Którą mam '+(p.type==='open_app'?'otworzyć':'zamknąć')+'?',{tries:p.tries+1});
      return r.msg;
    }
    case 'note':return miriDo('create_note',{text}).msg;
    case 'reminder':return miriDo('add_reminder',{text}).msg;
    case 'timer':{const s=parseDuration(raw)||(/^\d+$/.test(raw.trim())?+raw.trim()*60:0);if(!s&&p.tries<1)return ask('timer','Nie zrozumiałam czasu. Powiedz np. pięć minut.',{tries:1});return miriDo('set_timer',{seconds:s,label:p.label}).msg}
    case 'folder':return miriDo('create_folder',{name:text}).msg;
    case 'search':return miriDo('web_search',{query:text}).msg;
    case 'install':return miriDo('install_app',{app:text}).msg;
    case 'play':return miriDo('music',{action:'play',query:text}).msg;
  }
  return null;
}
const cutAfter=(raw,text,re)=>{const m=re.exec(raw);return m?text.slice(m.index+m[0].length).trim().replace(/^[:,\s]+/,''):null};

function miriLocal(text){
  const raw=miriNorm(text).replace(/[?!.,;]/g,' ').replace(/\s+/g,' ').trim();
  const n=(' '+raw+' ').replace(/\b(prosze|mi|mozesz|moglabys|czy|chcialbym|chcialabym|chce|jeszcze|teraz|tak)\b/g,' ').replace(/\s+/g,' ').trim();
  const has=(...a)=>a.some(x=>n.includes(x)), d=new Date();
  /* odpowiedź na pytanie Miri */
  if(MiriS.pending&&Date.now()-MiriS.pending.t<60000){
    const p=MiriS.pending; MiriS.pending=null;
    if(/^(anuluj|nie|nic|zapomnij|nie trzeba|stop|dziekuje|dzieki)\b/.test(raw))return 'Dobrze, anuluję.';
    const r=pendingHandle(p,text.trim(),n,raw); if(r!=null)return r;
  }else MiriS.pending=null;
  if(!raw)return ask('open_app','Słucham, o co chodzi?');

  /* rozmowa */
  if(/^(czesc|hej|hejka|witaj|dzien dobry|dobry wieczor|siema|halo|elo)( miri)?$/.test(raw))return 'Cześć '+S.user+'! W czym mogę pomóc?';
  if(/^(dzieki|dziekuje|dziekuje bardzo|super|swietnie|ok|okej|dobrze)$/.test(raw))return 'Proszę bardzo!';
  if(/^(pa|do widzenia|zamknij sie|wylacz sie|koniec)( miri)?$/.test(raw)){setTimeout(miriClose,2200);return 'Do usłyszenia!'}
  if(has('kim jestes','jak sie nazywasz','co potrafisz','co umiesz','pomoc','w czym mozesz pomoc'))return 'Jestem Miri. Otwieram i zamykam aplikacje, zapisuję notatki i przypomnienia, ustawiam minutniki, włączam muzykę, zmieniam tapety, motyw i głośność, pobieram aplikacje z App Store, szukam w internecie i odpowiadam na pytania, gdy działa połączenie z AI. Powiedz na przykład: otwórz zdjęcia.';
  if(has('ktora godzina','jaka godzina','ktora jest','jaki jest czas'))return 'Jest '+pad(d.getHours())+':'+pad(d.getMinutes())+'.';
  if(has('jaka data','jaki dzis dzien','jaki mamy dzien','ktorego dzis','jaki jest dzisiaj dzien','jaki dzis jest dzien'))return 'Dzisiaj jest '+d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  if(has('zart','kawal'))return JOKES[Math.random()*JOKES.length|0];
  if(has('rzuc moneta','orzel czy reszka'))return Math.random()<.5?'Orzeł.':'Reszka.';
  if(has('rzuc kostka'))return 'Wypadło '+(1+(Math.random()*6|0))+'.';

  /* system */
  if(has('ciemny tryb','tryb ciemny','ciemny motyw','tryb nocny','wlacz ciemny'))return miriDo('set_theme',{mode:'dark'}).msg;
  if(has('jasny tryb','tryb jasny','jasny motyw','tryb dzienny','wlacz jasny'))return miriDo('set_theme',{mode:'light'}).msg;
  if(has('pelny ekran'))return miriDo('system',{action:'fullscreen'}).msg;
  if(has('wylacz komputer','zamknij komputer','wylacz system'))return miriDo('system',{action:'shutdown'}).msg;
  if(has('zrestartuj','uruchom ponownie','restart komputera','restart systemu'))return miriDo('system',{action:'restart'}).msg;
  if(/\buspij\b/.test(n))return miriDo('system',{action:'sleep'}).msg;
  if(has('zablokuj ekran','zablokuj komputer'))return miriDo('system',{action:'lock'}).msg;
  if(has('mission control','wszystkie okna','pokaz okna')){setTimeout(toggleMC,300);return 'Pokazuję wszystkie okna.'}
  const vm=n.match(/glosnosc\w*\D{0,12}(\d{1,3})/); if(vm)return miriDo('set_volume',{level:+vm[1]}).msg;
  if(has('ciszej','scisz')){S.volume=Math.max(0,S.volume-20);saveS();applySettings();return 'Ściszam do '+S.volume+' procent.'}
  if(has('glosniej','zglosn')){S.volume=Math.min(100,S.volume+20);saveS();applySettings();return 'Zgłaśniam do '+S.volume+' procent.'}
  if(/^wycisz/.test(n))return miriDo('set_volume',{level:0}).msg;
  if(has('tapet')){
    const list=WALLS.filter(x=>x.id!=='custom'), w=list.find(x=>miriNorm(x.name).length>2&&n.includes(miriNorm(x.name)));
    if(w)return miriDo('set_wallpaper',{name:w.name}).msg;
    return miriDo('set_wallpaper',{next:true}).msg;
  }

  /* muzyka */
  if(has('nastepny utwor','nastepna piosenk','nastepny kawalek')||n==='dalej'||n==='nastepny')return miriDo('music',{action:'next'}).msg;
  if(has('poprzedni utwor','poprzednia piosenk')||n==='poprzedni')return miriDo('music',{action:'previous'}).msg;
  if(has('pauza','zatrzymaj muzyk','wylacz muzyk','stop muzyk','zatrzymaj piosenk','wstrzymaj','wylacz piosenk','nie graj'))return miriDo('music',{action:'stop'}).msg;
  if(Music.playing&&/^(stop|cisza|przestan|zatrzymaj|wylacz|spokoj|dosyc|wystarczy)( to| juz)?$/.test(n))return miriDo('music',{action:'stop'}).msg;
  if(has('co gra','jaki utwor gra','co teraz gra'))return Music.cur!=null&&Music.playing?'Gra: '+TRACKS[Music.cur].name+'.':'Teraz nic nie gra.';
  const pm=n.match(/^(?:zagraj|odtworz|pusc|wlacz|odpal)\s+(?:utwor\s+|piosenke\s+|muzyke\s+)?(.*)$/);
  if(pm){
    const q=pm[1].trim();
    if(!q||/^(muzyke|piosenke|cos|jakas muzyke|jakis utwor|jakas piosenke|muzyka|utwor|piosenka)$/.test(q))return miriDo('music',{action:'play'}).msg;
    if(q.length>=2&&TRACKS.some(t=>miriNorm(t.name).includes(q)))return miriDo('music',{action:'play',query:q}).msg;
  }
  if(/^(muzyka|muzyke)$/.test(n))return miriDo('music',{action:'play'}).msg;

  /* minutnik, przypomnienia, notatki, wydarzenia */
  if(has('minutnik','odlicz','timer','stoper')&&!has('otworz zegar')){
    const s=parseDuration(raw); if(s)return miriDo('set_timer',{seconds:s}).msg;
    return ask('timer','Na ile mam ustawić minutnik?');
  }
  const pr=cutAfter(raw,text,/\bprzypomnij(?:\s+mi)?\s+(?:o\s+)?|\bdodaj przypomnienie\s*(?:o\s+|ze\s+|:\s*)?|\bnowe przypomnienie\s*(?:o\s+|:\s*)?/);
  if(pr!==null){
    const s=/\bza\s+\S+\s+\S+/.test(raw)?parseDuration(raw):0;
    if(s)return miriDo('set_timer',{seconds:s,label:pr.replace(/\bza\s+\S+\s+\S+\s*/i,'').trim()}).msg;
    return pr?miriDo('add_reminder',{text:pr}).msg:ask('reminder','O czym mam Ci przypomnieć?');
  }
  const nt=cutAfter(raw,text,/\b(?:zapisz|zanotuj|notuj)\b\s*(?:notatke\s+)?(?:to\s+|ze\s+|jako\s+|o\s+|:\s*)?/)??cutAfter(raw,text,/\b(?:zrob|dodaj|stworz|utworz|napisz|nowa)\b[a-z ]*?\bnotatk\w*\s*(?:o\s+|ze\s+|z trescia\s+|:\s*)?/);
  if(nt!==null)return nt?miriDo('create_note',{text:nt}).msg:ask('note','Co mam zapisać?');
  if(has('przeczytaj notatk','ostatnia notatka','co zapisalem','co zapisalam')){const nn=store.get('notes',[]);return nn.length?'Ostatnia notatka: '+nn[0].t.split('\n')[0]:'Nie masz jeszcze notatek.'}
  const ce=cutAfter(raw,text,/\bdodaj wydarzenie\s*(?:o\s+|:\s*)?/);
  if(ce!==null)return ce?miriDo('calendar_event',{date:new Date().toISOString().slice(0,10),title:ce}).msg:'Podaj nazwę wydarzenia, np. dodaj wydarzenie spotkanie.';

  /* pliki */
  const fo=cutAfter(raw,text,/\b(?:utworz|stworz|zrob|dodaj)\s+(?:nowy\s+)?folder\s*(?:o nazwie\s+|:\s*)?/);
  if(fo!==null)return fo?miriDo('create_folder',{name:fo}).msg:ask('folder','Jak ma się nazywać folder?');
  if(has('co jest na pulpicie','co mam na pulpicie')){const l=VFS.list(HOME+'/Desktop').map(x=>x[0]);return l.length?'Na pulpicie masz: '+l.join(', ')+'.':'Pulpit jest pusty.'}

  /* internet */
  const sq=cutAfter(raw,text,/^(?:wyszukaj|szukaj|znajdz|wygoogluj|sprawdz)\s+(?:w\s+internecie\s+|w\s+sieci\s+|w\s+google\s+)?/);
  if(sq!==null)return sq?miriDo('web_search',{query:sq}).msg:ask('search','Czego mam szukać?');
  if(/^pogoda\b|^jaka (?:jest )?pogoda/.test(raw))return 'Nie mam własnych danych o pogodzie, więc '+miriDo('web_search',{query:'pogoda '+(raw.replace(/^(jaka )?(jest )?pogoda\s*/,'')||'')}).msg.toLowerCase();
  const um=miriNorm(text).trim().match(/(?:otworz|wejdz na|idz na|przejdz na|pokaz)\s+(?:strone\s+)?((?:https?:\/\/)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/\S*)?)/);
  if(um)return miriDo('open_url',{url:um[1]}).msg;

  /* aplikacje */
  const ins=cutAfter(raw,text,/^(?:pobierz|zainstaluj|sciagnij)\s+(?:aplikacje\s+|program\s+)?/);
  if(ins!==null)return ins?miriDo('install_app',{app:ins}).msg:ask('install','Którą aplikację mam pobrać?');
  const uni=cutAfter(raw,text,/^(?:odinstaluj|usun aplikacje|usun)\s+(?:aplikacje\s+)?/);
  if(uni){const id=resolveApp(uni);if(id&&S.installed.includes(id))return miriDo('uninstall_app',{app:uni}).msg}
  const cl=cutAfter(raw,text,/^zamknij\s+(?:aplikacje\s+|okno\s+|program\s+)?/);
  if(cl!==null)return cl?miriDo('close_app',{app:cl}).msg:ask('close_app','Którą aplikację mam zamknąć?');
  if(/^(?:otworz|uruchom|wlacz|pokaz|przejdz do|idz do|odpal|wejdz do|chce otworzyc)\b/.test(n)||/^(?:aplikacje|program)$/.test(n)){
    const rest=n.replace(/^(?:otworz|uruchom|wlacz|pokaz|przejdz do|idz do|odpal|wejdz do|chce otworzyc)\s*/,'').replace(/^(?:aplikacje|aplikacja|apke|apka|program|okno|mi)\b\s*/,'').trim();
    if(!rest)return ask('open_app','Którą aplikację mam otworzyć?');
    const id=resolveApp(rest);
    if(id)return miriDo('open_app',{app:rest}).msg;
    if(/^(?:otworz|uruchom|odpal|przejdz do|idz do)/.test(n))return 'Nie znam aplikacji „'+rest.slice(0,40)+'”.';
  }
  if(raw.split(' ').length<=3){const id=appFromText(raw);if(id&&APPS[id]&&raw.length<=24)return miriDo('open_app',{app:raw}).msg}

  /* kalkulator */
  if(has('policz','ile to','ile jest','oblicz')||(/^[\d\s+\-*/x÷^().,]+$/.test(raw)&&/\d\s*[+\-*/x÷^]\s*\d/.test(raw))){
    const e=n.replace(/policz|ile to jest|ile to|ile jest|oblicz/g,' ').replace(/ plus /g,'+').replace(/ minus /g,'-').replace(/ razy /g,'*').replace(/ x /g,'*').replace(/ podzielic przez | podzielic na | podziel przez | podziel na /g,'/').replace(/ do kwadratu/g,'**2').replace(/\^/g,'**').replace(/,/g,'.').replace(/\s+/g,'');
    if(/^[\d+\-*/().]+$/.test(e)&&/\d/.test(e)){try{const v=Function('"use strict";return('+e+')')();if(isFinite(v))return 'To jest '+String(+v.toPrecision(12)).replace('.',',')+'.'}catch(er){}}
  }
  return null;
}
async function miriAI(chat){
  const msgs=chat.msgs.slice(-16).map(m=>({role:m.r,content:m.t}));
  const context={now:new Date().toString().slice(0,60),user:S.user,apps:[...BASE_APPS,...S.installed].filter(i=>APPS[i]).map(i=>APPS[i].name),playing:Music.playing&&Music.cur!=null?TRACKS[Music.cur].name:''};
  try{
    const r=await fetch(S.miri.endpoint||'/api/miri',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,style:S.miri.style,custom:S.miri.custom,context})});
    let j={}; try{j=await r.json()}catch(e){}
    if(r.ok&&(j.text||(j.actions&&j.actions.length)))return{text:j.text||'',actions:Array.isArray(j.actions)?j.actions:[]};
    if(r.status===404||r.status===405||!j.error)return{text:NO_AI,actions:[]};
    return{text:'Miri AI: '+j.error,actions:[]};
  }catch(e){return{text:NO_AI,actions:[]}}
}
async function miriHandle(text,opts={}){
  text=(text||'').replace(/^\s*(?:(?:hej|hey|hei|cześć|czesc|ok|okej)[\s,]*)?(?:miri|miry|siri)\b[\s,.!:]*/i,'').trim()||(text||'').trim(); if(!text)return;
  const chat=opts.chatId?(Chats.find(c=>c.id===opts.chatId)||miriChat(false)):miriChat(!!opts.panel);
  MiriS.chat=chat.id; MiriS.transcript=text; MiriS.reply=''; clearTimeout(MiriS.closeT);
  pushMsg(chat,'user',text); setState('thinking');
  let reply=null; try{reply=miriLocal(text)}catch(e){console.error(e);reply=null}
  if(reply==null){
    const r=await miriAI(chat);
    reply=r.actions.length?(miriSummary(r.actions,text)||r.text||'Nie jestem pewna, o co prosisz. Powtórz, proszę.'):(r.text||'Nie mam nic do dodania.');
  }
  pushMsg(chat,'assistant',reply); MiriS.reply=reply; setState('idle'); miriUI();
  const fin=()=>{setState('idle');sfx('miriend');miriScheduleClose();if(MiriS.pending&&opts.voice)miriListen();else miriStartWake()};
  if(S.miri.speak&&window.speechSynthesis){setState('speaking');miriSpeak(reply,fin)}else fin();
}

/* ---------- ustawienia Miri (używane w aplikacji i w Ustawieniach systemowych) ---------- */
const MIRI_STYLES=[['friendly','Przyjazny'],['concise','Zwięzły'],['formal','Formalny'],['funny','Żartobliwy'],['teacher','Nauczyciel']];
function miriSettingsUI(host){
  host.innerHTML=''; const card=el('div','card');
  const sw=(on_,cb)=>{const b=el('button','sw'+(on_?' on':''));b.setAttribute('role','switch');b.setAttribute('aria-checked',!!on_);b.onclick=()=>{on_=!on_;b.classList.toggle('on',on_);b.setAttribute('aria-checked',on_);cb(on_)};return b};
  const row=(label,ctl,sub)=>{const r=el('div','row','<div><span></span><small></small></div>');$('span',r).textContent=label;$('small',r).textContent=sub||'';if(!sub)$('small',r).remove();r.append(ctl);return r};
  card.append(row('Hey Miri',sw(S.miri.wake,v=>miriSetWake(v)),SRC?'Nasłuchuje wywołania „Hey Miri” (mikrofon, HTTPS, Chrome lub Edge)':'Ta przeglądarka nie obsługuje rozpoznawania mowy'));
  card.append(row('Mów odpowiedzi',sw(S.miri.speak,v=>{S.miri.speak=v;saveS()})));
  const sel=el('select'); sel.style.cssText='border:0;border-radius:6px;background:var(--field);color:var(--fg);padding:4px 8px'; sel.setAttribute('aria-label','Styl wypowiedzi');
  [...MIRI_STYLES].forEach(([k,l])=>{const o=el('option');o.value=k;o.textContent=l;if(S.miri.style===k)o.selected=true;sel.append(o)});
  sel.onchange=()=>{S.miri.style=sel.value;saveS();emit('miricfg')};
  card.append(row('Styl wypowiedzi',sel));
  const ta=el('textarea'); ta.value=S.miri.custom; ta.placeholder='np. zwracaj się do mnie Maks i odpowiadaj krótko'; ta.maxLength=500; ta.setAttribute('aria-label','Własne wskazówki');
  ta.style.cssText='width:100%;min-height:58px;border:0;border-radius:8px;background:var(--field);color:var(--fg);padding:8px 10px;font:inherit;resize:vertical;user-select:text'; ta.onchange=()=>{S.miri.custom=ta.value.trim();saveS()};
  const tr=el('div','row'); tr.style.display='block'; tr.innerHTML='<span>Własne wskazówki dla Miri</span>'; tr.append(ta); card.append(tr);
  const clr=el('button','btn','Usuń rozmowy'); clr.onclick=()=>{Chats=[];MiriS.chat=null;saveChats();emit('mirichat')}; card.append(row('Historia rozmów',clr));
  host.append(card);
}

/* ---------- aplikacja Miri AI ---------- */
function renderMiriApp(body,w){
  const side=el('div','side'), main=el('div','main'); body.append(side,main);
  const head=el('div','mhead'), orbC=el('canvas'); orbC.width=60; orbC.height=60; registerOrb(orbC);
  const title=el('b','','Miri AI'), sp=el('span','sp'); sp.style.flex='1';
  const sel=el('select'); sel.setAttribute('aria-label','Styl wypowiedzi'); MIRI_STYLES.forEach(([k,l])=>{const o=el('option');o.value=k;o.textContent=l;if(S.miri.style===k)o.selected=true;sel.append(o)});
  sel.onchange=()=>{S.miri.style=sel.value;saveS();emit('miricfg')};
  const gear=el('button','tbtn','Ustawienia'), mic=el('button','tbtn',MIC_SVG); mic.setAttribute('aria-label','Mów'); mic.title='Mów do Miri';
  head.append(orbC,title,sp,sel,mic,gear);
  const sets=el('div','mset'); sets.hidden=true;
  const msgs=el('div','mchat'), form=el('form','minput'), inp=el('input'), send=el('button','btn p','Wyślij');
  inp.placeholder='Napisz do Miri…'; inp.setAttribute('aria-label','Wiadomość do Miri'); inp.autocomplete='off'; send.type='submit';
  form.append(inp,send); main.append(head,sets,msgs,form);
  let cur=MiriS.chat||(Chats[0]&&Chats[0].id)||null;
  function drawSide(){
    side.innerHTML='<h6>Rozmowy</h6>'; const nb=el('div','sl'); nb.innerHTML='<span style="color:var(--accent)">＋ Nowa rozmowa</span>'; nb.onclick=()=>{cur=miriNewChat().id;drawSide();drawMsgs()}; side.append(nb);
    Chats.forEach(c=>{const s=el('div','sl'+(c.id===cur?' on':''));s.textContent=c.title;s.title=c.title;s.onclick=()=>{cur=c.id;MiriS.chat=c.id;drawSide();drawMsgs()};s.oncontextmenu=e=>{e.preventDefault();popMenu([['Usuń rozmowę',()=>{Chats=Chats.filter(x=>x!==c);if(cur===c.id)cur=null;saveChats();drawSide();drawMsgs()}]],e.clientX,e.clientY)};side.append(s)});
  }
  function drawMsgs(){
    msgs.innerHTML=''; const c=Chats.find(x=>x.id===cur);
    if(!c||!c.msgs.length){
      const wl=el('div','mwelcome','<canvas width="192" height="192"></canvas><h3 style="margin:0 0 6px;color:var(--fg)">Cześć, jestem Miri</h3><p style="margin:0 0 12px">Napisz pytanie, powiedz „Hey Miri” albo wybierz coś poniżej.</p>'); registerOrb($('canvas',wl));
      const chips=el('div'); chips.style.cssText='display:flex;flex-wrap:wrap;gap:6px;justify-content:center'; ['Która godzina?','Zagraj muzykę','Otwórz kalendarz','Opowiedz żart','Ustaw minutnik na 5 minut'].forEach(t=>{const b=el('button','tbtn');b.textContent=t;b.onclick=()=>ask(t);chips.append(b)}); wl.append(chips); msgs.append(wl); return;
    }
    c.msgs.forEach(m=>{const b=el('div','mb '+(m.r==='user'?'u':'a'));b.textContent=m.t;msgs.append(b)});
    if(MiriS.state==='thinking'&&MiriS.chat===cur)msgs.append(el('div','mb a mtype','<i></i><i></i><i></i>'));
    msgs.scrollTop=msgs.scrollHeight;
  }
  function ask(t){if(!cur){cur=miriNewChat().id}miriHandle(t,{chatId:cur});drawSide();drawMsgs()}
  form.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();inp.value='';if(v)ask(v)};
  gear.onclick=()=>{sets.hidden=!sets.hidden;if(!sets.hidden)miriSettingsUI(sets)};
  mic.onclick=()=>{miriOpen({auto:true});miriListen()};
  w.on('mirichat',()=>{if(!Chats.find(c=>c.id===cur))cur=MiriS.chat||(Chats[0]&&Chats[0].id)||null;drawSide();drawMsgs()});
  w.on('miristate',drawMsgs); w.on('miricfg',()=>{sel.value=S.miri.style});
  drawSide(); drawMsgs(); setTimeout(()=>inp.focus(),80);
}
Object.assign(APPS,{miri:{name:'Miri AI',w:820,h:560,render:renderMiriApp}});

function miriInit(){
  const btn=$('#miribtn'); registerOrb($('canvas',btn),true);
  btn.onclick=e=>{e.stopPropagation();MiriS.open?miriClose():miriOpen({focus:true})};
  btn.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();const r=btn.getBoundingClientRect();miriMenu(r.left-150,MB+2)};
}

S.installed=S.installed.filter(i=>APPS[i]);
VFS.syncApps(); applySettings(); buildMenubar(); refreshDock(); drawIcons(); miriInit();
if(S.wall==='auto')setInterval(applySettings,600000);
boot();
