<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>MGS Computer</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Układ: pełnoekranowy pulpit. Pasek menu u góry, okna pośrodku, dock na dole, nakładki systemowe na wierzchu. */
:root{
  --bg:#cfd4e2; --fg:#1d1d1f; --fg2:#6e6e73; --line:rgba(0,0,0,.1);
  --accent:#0a84ff; --orange:#ff9f0a; --red:#ff5f57; --yellow:#febc2e; --green:#28c840;
  --win:#ffffff; --chrome:rgba(246,246,247,.86); --sidebar:rgba(236,236,240,.82);
  --menubar:rgba(255,255,255,.5); --menu:rgba(250,250,252,.88);
  --dock:rgba(255,255,255,.34); --dock-line:rgba(255,255,255,.55);
  --shadow:0 22px 60px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.28);
  --field:rgba(0,0,0,.055); --dim:0; --hover:rgba(0,0,0,.07); --strong:rgba(0,0,0,.14);
  --term-bg:#1c1c1e; --term-fg:#e5e5e7;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --wall:radial-gradient(1100px 700px at 15% 8%,#ffb56e 0,transparent 60%),radial-gradient(1000px 800px at 88% 18%,#ff6f9c 0,transparent 55%),radial-gradient(1300px 900px at 50% 115%,#5a5ad8 0,transparent 62%),linear-gradient(160deg,#8a74f2,#2a2e78);
}
:root[data-wall="2"]{--wall:radial-gradient(1000px 700px at 80% 5%,#7cf0e0 0,transparent 58%),radial-gradient(1100px 800px at 10% 40%,#3a8bd8 0,transparent 60%),radial-gradient(1200px 800px at 60% 120%,#12306b 0,transparent 60%),linear-gradient(170deg,#2a7fd0,#0c2552)}
:root[data-wall="3"]{--wall:radial-gradient(1000px 700px at 20% 0,#e4f8a8 0,transparent 55%),radial-gradient(1200px 800px at 90% 60%,#2fc87a 0,transparent 60%),radial-gradient(1200px 800px at 30% 120%,#0a4a52 0,transparent 62%),linear-gradient(170deg,#4cc98a,#0b3b45)}
:root[data-wall="4"]{--wall:radial-gradient(900px 600px at 25% 15%,#6a6f80 0,transparent 60%),radial-gradient(1100px 800px at 90% 100%,#2a2c36 0,transparent 60%),linear-gradient(160deg,#4a4e5c,#17181e)}
:root[data-wall="5"]{--wall:radial-gradient(1000px 700px at 85% 10%,#ffe29a 0,transparent 55%),radial-gradient(1200px 800px at 10% 70%,#ff8fa3 0,transparent 60%),radial-gradient(1200px 800px at 70% 120%,#7a5cff 0,transparent 60%),linear-gradient(170deg,#ffb48a,#6a4cc8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c12; --fg:#f5f5f7; --fg2:#a1a1a6; --line:rgba(255,255,255,.12);
  --win:#1f1f22; --chrome:rgba(46,46,50,.86); --sidebar:rgba(38,38,42,.82);
  --menubar:rgba(18,18,22,.45); --menu:rgba(44,44,48,.88);
  --dock:rgba(30,30,34,.4); --dock-line:rgba(255,255,255,.16);
  --shadow:0 22px 60px rgba(0,0,0,.62),0 0 0 .5px rgba(255,255,255,.2);
  --field:rgba(255,255,255,.08); --dim:.38; --hover:rgba(255,255,255,.09); --strong:rgba(255,255,255,.18);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c12; --fg:#f5f5f7; --fg2:#a1a1a6; --line:rgba(255,255,255,.12);
  --win:#1f1f22; --chrome:rgba(46,46,50,.86); --sidebar:rgba(38,38,42,.82);
  --menubar:rgba(18,18,22,.45); --menu:rgba(44,44,48,.88);
  --dock:rgba(30,30,34,.4); --dock-line:rgba(255,255,255,.16);
  --shadow:0 22px 60px rgba(0,0,0,.62),0 0 0 .5px rgba(255,255,255,.2);
  --field:rgba(255,255,255,.08); --dim:.38; --hover:rgba(255,255,255,.09); --strong:rgba(255,255,255,.18);
  color-scheme:dark}

*{box-sizing:border-box;cursor:var(--c-arrow) 4 2,default;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.5) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
a,.lnk{cursor:var(--c-hand) 11 2,pointer}
input:not([type=range]):not([type=checkbox]),textarea,.term,.note,.sel-text{cursor:var(--c-ibeam) 7 10,text}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;letter-spacing:-.003em}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#desk{position:absolute;inset:0;background:var(--wall);background-size:cover;overflow:hidden;transition:background .6s}
#desk::before{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim);pointer-events:none}
#dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9000}

/* pasek menu */
#menubar{position:absolute;top:0;left:0;right:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--menubar);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);z-index:800;font-size:13px}
#menubar .l,#menubar .r{display:flex;align-items:center;gap:1px;min-width:0}
.mi{height:22px;padding:0 9px;border-radius:5px;display:flex;align-items:center;gap:6px;white-space:nowrap;border:0;background:none}
.mi:hover,.mi.open{background:var(--hover)}
.mi.b{font-weight:700}
.mi svg{display:block}
#menubar .r .mi{padding:0 7px}
.lgo{position:relative;display:inline-block;vertical-align:middle;flex:none}
.lgo svg{display:block}
.lgo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.lgo.has img{display:block}
.lgo.has svg{visibility:hidden}
/* logo z pliku bywa czarne na białym tle: w jasnym pasku znika biel, w ciemnych miejscach logo jest odwracane */
.mi .lgo img{mix-blend-mode:multiply}
#screen .lgo img{filter:invert(1);mix-blend-mode:screen}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mi .lgo img{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"] .mi .lgo img{filter:invert(1);mix-blend-mode:screen}
.ico{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){#menubar .l .mi:nth-child(n+4){display:none}#clock .wd{display:none}}

.dropdown{position:fixed;min-width:210px;padding:5px;border-radius:10px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--shadow);z-index:850;font-size:13px;animation:fadein .08s}
.dd{display:flex;justify-content:space-between;gap:24px;padding:3px 10px;border-radius:5px;white-space:nowrap}
.dd:hover{background:var(--accent);color:#fff}
.dd small{opacity:.55}
.dd.off{opacity:.38;pointer-events:none}
.dd.chk::before{content:"✓";margin-right:-14px;margin-left:-4px;font-size:11px}
.sep{height:1px;background:var(--line);margin:5px 8px}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* okna */
#windows{position:absolute;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;border-radius:12px;background:var(--win);box-shadow:var(--shadow);overflow:hidden;pointer-events:auto;transform-origin:50% 50%;animation:pop .24s cubic-bezier(.2,.9,.3,1.15);transition:transform .45s cubic-bezier(.3,.8,.2,1),opacity .25s}
.win:not(.front){box-shadow:0 10px 32px rgba(0,0,0,.2),0 0 0 .5px var(--line)}
.win.animating{transition:left .32s cubic-bezier(.3,.8,.2,1),top .32s cubic-bezier(.3,.8,.2,1),width .32s cubic-bezier(.3,.8,.2,1),height .32s cubic-bezier(.3,.8,.2,1),transform .45s cubic-bezier(.3,.8,.2,1)}
.win.min{visibility:hidden;pointer-events:none}
.win.closing{animation:pop-out .2s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.win.mc{transition:transform .45s cubic-bezier(.3,.8,.2,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes pop-out{to{transform:scale(.9);opacity:0}}
.tb{height:38px;flex:none;display:flex;align-items:center;padding:0 13px;background:var(--chrome);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid var(--line);touch-action:none;position:relative}
.lights{display:flex;gap:8px;z-index:1}
.c{width:12px;height:12px;border-radius:50%;background:#8e8e93;opacity:.45;display:grid;place-items:center;font-style:normal;position:relative}
.front .c.r{background:var(--red);opacity:1}.front .c.y{background:var(--yellow);opacity:1}.front .c.g{background:var(--green);opacity:1}
.lights:hover .c{opacity:1}
.lights:hover .c.r{background:var(--red)}.lights:hover .c.y{background:var(--yellow)}.lights:hover .c.g{background:var(--green)}
.c::after{content:"";font-size:9px;line-height:1;color:rgba(0,0,0,.55);font-weight:800}
.lights:hover .c.r::after{content:"×"}.lights:hover .c.y::after{content:"−"}.lights:hover .c.g::after{content:"+"}
.ttl{position:absolute;left:70px;right:70px;text-align:center;font-weight:600;font-size:13px;pointer-events:none;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .ttl{opacity:.9}
.body{flex:1;min-height:0;display:flex;position:relative}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:5}

/* pulpit */
#icons{position:absolute;top:36px;right:10px;bottom:100px;left:10px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:6px;z-index:1;pointer-events:none}
.di{width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;border-radius:6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:auto;text-align:center;font-size:12px}
.di svg{width:56px;height:48px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.di svg.app{height:56px}
.di span{padding:1px 5px;border-radius:4px;overflow-wrap:anywhere;max-width:100%;line-height:1.2}
.di.sel span{background:var(--accent);text-shadow:none}
.di.sel{background:rgba(255,255,255,.14)}
@media (max-width:600px){.di{width:70px}.di svg{width:44px}}

/* dock */
#dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:700;display:flex;align-items:flex-end;gap:10px;padding:8px 12px;border-radius:26px;background:var(--dock);border:1px solid var(--dock-line);backdrop-filter:blur(36px) saturate(2);-webkit-backdrop-filter:blur(36px) saturate(2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.06),0 24px 56px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,.8,.2,1);max-width:calc(100vw - 12px)}
#dock.hide{transform:translate(-50%,130%)}
.dk{position:relative;flex:none;transition:width .09s ease-out,height .09s ease-out;display:block;border:0;background:none;padding:0}
.dk svg.app{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.dk::after{content:attr(data-label);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);padding:3px 11px;border-radius:7px;background:var(--menu);backdrop-filter:blur(20px);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;color:var(--fg)}
.dk:hover::after{opacity:1}
.dk .dot{position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg);opacity:0}
.dk.run .dot{opacity:.75}
.dk.bounce{animation:bounce .55s cubic-bezier(.3,0,.4,1) 2}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-24px)}}
.dsep{width:1px;align-self:stretch;margin:4px 1px;background:var(--dock-line)}
@media (max-width:600px){#dock{overflow-x:auto;overflow-y:hidden;gap:6px;padding:5px 7px}.dk::after{display:none}}

/* nakładki */
.modal{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.22);display:flex;justify-content:center;align-items:flex-start;padding-top:22vh;animation:fadein .12s}
.dlg{width:min(380px,calc(100vw - 32px));border-radius:14px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;animation:pop .2s cubic-bezier(.2,.9,.3,1.15)}
.dlg .dic{width:56px}.dlg .dic svg{width:56px;height:56px}
.dlg h4{margin:0 0 4px;font-size:14px}
.dlg p{margin:0;color:var(--fg2);font-size:12.5px;white-space:pre-line}
.dlg input{width:100%;margin-top:10px;padding:6px 9px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:inherit;outline:0}
.dlg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.dbt{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;padding:4px 16px;border-radius:6px;background:var(--strong);min-height:24px}
.btn.p{background:var(--accent);color:#fff}
.btn:active{filter:brightness(.9)}
#spot{position:fixed;inset:0;z-index:950;display:flex;justify-content:center;align-items:flex-start;padding-top:16vh;background:rgba(0,0,0,.12)}
#spot .box{width:min(640px,calc(100vw - 32px));border-radius:16px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease}
#spot .q{display:flex;align-items:center;gap:12px;padding:14px 18px}
#spot input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:22px;color:var(--fg);user-select:text;-webkit-user-select:text}
#spot input::placeholder{color:var(--fg2)}
#spot .res{border-top:1px solid var(--line);padding:6px;max-height:52vh;overflow:auto}
#spot .res:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;font-size:14px}
.sr.sel{background:var(--accent);color:#fff}
.sr svg{width:28px;height:28px;flex:none}
.sr small{margin-left:auto;opacity:.6}
.sr b{font-weight:500}
#cc,#nc{position:fixed;top:34px;right:8px;border-radius:18px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow);z-index:850;animation:pop .16s ease}
#cc{width:310px;padding:12px;display:grid;gap:10px}
#nc{width:340px;max-width:calc(100vw - 16px);padding:14px;max-height:calc(100% - 50px);overflow:auto}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--field);border:0;text-align:left;width:100%}
.cc-row .pill{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.cc-row .pill.off{background:var(--strong);color:var(--fg)}
.cc-row small{display:block;color:var(--fg2);font-size:11px}
.cc-sl{padding:10px 12px;border-radius:12px;background:var(--field)}
.cc-sl label{display:block;font-weight:600;font-size:12px;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
#banners{position:fixed;top:36px;right:10px;z-index:840;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.banner{width:330px;max-width:calc(100vw - 20px);display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:16px;background:var(--menu);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow);animation:slidein .4s cubic-bezier(.2,.9,.3,1.1)}
.banner.out{animation:slideout .3s forwards}
.banner svg{width:36px;height:36px;flex:none}
.banner b{display:block}.banner span{color:var(--fg2);font-size:12.5px}
@keyframes slidein{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideout{to{transform:translateX(120%);opacity:0}}
.nrow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--field);margin-top:8px}
.nrow svg{width:32px;height:32px;flex:none}
.nrow b{display:block}.nrow span{color:var(--fg2);font-size:12px}
#launch{position:fixed;inset:0;z-index:780;background:rgba(10,10,20,.35);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);display:flex;flex-direction:column;align-items:center;padding:56px 5vw 100px;animation:fadein .2s;overflow:auto;color:#fff}
#launch input{width:min(300px,80vw);padding:6px 12px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:#fff;font:inherit;outline:0;text-align:center;margin-bottom:34px}
#launch input::placeholder{color:rgba(255,255,255,.7)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:30px 10px;width:min(960px,100%)}
.li{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5);animation:pop .3s both}
.li svg{width:76px;height:76px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#mcbg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:1;opacity:0;pointer-events:none;transition:opacity .3s}
#mcbg.on{opacity:1;pointer-events:auto}
.mclab{position:absolute;z-index:3;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center;pointer-events:none;transform:translateX(-50%)}
#windows.mcmode .win{cursor:pointer}
#windows.mcmode .win *{pointer-events:none}

/* ekran: start, logowanie, uśpienie */
#screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
#screen[hidden]{display:none!important}
#screen.fade{opacity:0;pointer-events:none}
#screen.boot,#screen.off,#screen.sleep,#screen.shut{background:#000}
#screen.login{background:var(--wall);background-size:cover}
#screen.login::before{content:"";position:absolute;inset:0;backdrop-filter:blur(26px) brightness(.8);-webkit-backdrop-filter:blur(26px) brightness(.8)}
#screen>*{position:relative}
#screen .bl{width:76px;height:76px;color:#fff}
#screen .bar{width:200px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:46px;overflow:hidden}
#screen .bar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width 2.8s cubic-bezier(.4,.1,.3,1)}
#screen .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;margin-top:40px}
@keyframes rot{to{transform:rotate(360deg)}}
#screen .big{position:absolute;top:9vh;text-align:center}
#screen .big b{display:block;font-size:min(84px,18vw);font-weight:300;letter-spacing:-.02em}
#screen .big span{font-size:20px;font-weight:500;opacity:.9}
#screen .av{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#screen .nm{font-size:19px;font-weight:600;margin:12px 0 14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
#screen .pw{display:flex;align-items:center;background:rgba(255,255,255,.22);border-radius:18px;padding:0 6px 0 14px;width:230px;backdrop-filter:blur(10px)}
#screen .pw input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;padding:7px 0}
#screen .pw input::placeholder{color:rgba(255,255,255,.75)}
#screen .pw button{width:24px;height:24px;border-radius:50%;border:0;background:rgba(255,255,255,.3);color:#fff}
#screen .hint{margin-top:12px;font-size:12px;opacity:.8}
#screen .pwr{position:absolute;bottom:6vh;display:flex;gap:34px}
#screen .pwr button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
#screen .pwr i{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
#screen .shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#screen .offhint{position:absolute;bottom:8vh;opacity:0;animation:fadein 1s 2s forwards;font-size:13px;color:#8e8e93}

/* wspólne elementy aplikacji */
.side{width:176px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
.side h6{margin:10px 8px 4px;font-size:11px;font-weight:600;color:var(--fg2)}
.side h6:first-child{margin-top:2px}
.sl{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;white-space:nowrap}
.sl:hover{background:var(--hover)}
.sl.on{background:var(--strong);font-weight:600}
.sl.drop{background:var(--accent);color:#fff}
.sl svg{width:16px;height:16px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-weight:600}
.bar .sp{flex:1}
.bar button,.tbtn{border:0;background:var(--field);border-radius:6px;min-width:28px;height:24px;padding:0 8px}
.bar button:disabled{opacity:.35}
.bar button.on{background:var(--strong)}
.bar input,.field{border:0;border-radius:6px;background:var(--field);color:var(--fg);padding:3px 9px;outline:0;font:inherit;font-weight:400;min-width:0}
.bar input{width:130px}
.grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:min-content;gap:10px 6px;align-content:start}
.it{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px;border-radius:8px;text-align:center;min-width:0}
.it svg{width:54px;height:46px}
.it svg.app{height:54px}
.it .ph{width:62px;height:46px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.it .ph svg{width:100%;height:100%;display:block}
.it span{font-size:12px;line-height:1.25;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere;max-width:100%}
.it.sel span{background:var(--accent);color:#fff}
.it.sel{background:var(--hover)}
.it.drop{background:var(--accent);color:#fff}
.lst{flex:1;overflow:auto}
.lst table{width:100%;border-collapse:collapse}
.lst th{position:sticky;top:0;background:var(--win);text-align:left;font-weight:500;color:var(--fg2);padding:5px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.lst td{padding:4px 10px;white-space:nowrap}
.lst td:first-child{display:flex;align-items:center;gap:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.lst td svg{width:18px;height:16px;flex:none}
.lst tr:nth-child(even) td{background:var(--field)}
.lst tr.sel td{background:var(--accent);color:#fff}
.status{padding:5px 14px;font-size:11px;color:var(--fg2);border-top:1px solid var(--line);text-align:center}
.empty{flex:1;display:grid;place-items:center;color:var(--fg2);font-size:15px;text-align:center;padding:20px}
@media (max-width:600px){.side{width:120px}.bar input{width:80px}}

.nlist{width:190px;flex:none;border-right:1px solid var(--line);background:var(--sidebar);overflow:auto;display:flex;flex-direction:column}
.nl{padding:9px 14px;border-bottom:1px solid var(--line)}
.nl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl span{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nl.on{background:#f4c84a;color:#1d1d1f}.nl.on span{color:rgba(0,0,0,.6)}
.nl.new{color:var(--accent);font-weight:600}
.note{flex:1;min-width:0;border:0;outline:0;resize:none;padding:18px 22px;background:var(--win);color:var(--fg);font:15px/1.5 var(--font);user-select:text;-webkit-user-select:text}
.note.mono{font:13px/1.55 var(--mono)}
@media (max-width:600px){.nlist{width:120px}}

.calc{flex:1;display:flex;flex-direction:column;background:#1c1c1e;padding:10px;gap:8px;color:#fff;--k-num:#4a4a50;--k-fn:#6e6e76}
.calc .scr{flex:1;min-height:70px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:44px;font-weight:300;padding:0 8px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.keys button{border:0;border-radius:999px;height:46px;font-size:20px;background:var(--k-num);color:#fff}
.keys button:active{filter:brightness(1.3)}
.keys .fn{background:var(--k-fn)}
.keys .op{background:var(--orange);font-size:24px}
.keys .op.on{background:#fff;color:var(--orange)}
.keys .z{grid-column:span 2;text-align:left;padding-left:22px}

.term{flex:1;min-width:0;background:var(--term-bg);color:var(--term-fg);font:12.5px/1.45 var(--mono);padding:8px 10px;overflow:auto;user-select:text;-webkit-user-select:text;white-space:pre-wrap;overflow-wrap:anywhere}
.term .ln{display:flex;gap:0}
.term .ln span.pr{white-space:pre;flex:none}
.term input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;padding:0}

.set{flex:1;overflow:auto;padding:22px;display:grid;gap:18px;align-content:start}
.set h3{margin:0 0 8px;font-size:12px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.set h2{margin:0;font-size:20px}
.card{background:var(--field);border-radius:10px;padding:4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{display:block;color:var(--fg2)}
.sw{width:38px;height:22px;border-radius:999px;background:var(--strong);position:relative;border:0;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:18px}
.walls,.accs{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.walls button{width:84px;height:54px;border-radius:8px;border:2px solid transparent;padding:0}
.walls button.on{border-color:var(--accent)}
.accs button{width:24px;height:24px;border-radius:50%;border:2px solid var(--win);outline:2px solid transparent;padding:0}
.accs button.on{outline-color:var(--fg2)}

.cal{flex:1;display:flex;min-width:0}
.cal-m{flex:1;display:flex;flex-direction:column;padding:14px 18px;min-width:0}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{margin:0;font-size:22px;font-weight:700;flex:1;text-transform:capitalize}
.cal-h button{border:0;background:var(--field);border-radius:6px;min-width:30px;height:26px;padding:0 8px}
.cal-g{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-g div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;font-size:12px;text-align:right;overflow:hidden}
.cal-g .wd{color:var(--fg2);font-size:11px;font-weight:600;padding:3px 6px;text-transform:uppercase;letter-spacing:.04em}
.cal-g .o{color:var(--fg2);opacity:.55}
.cal-g .t span{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:#ff3b30;color:#fff;font-weight:700}
.cal-g .s{background:var(--hover)}
.cal-g i{display:block;font-style:normal;text-align:left;font-size:10.5px;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-s{width:200px;flex:none;border-left:1px solid var(--line);padding:14px;background:var(--sidebar);overflow:auto}
@media (max-width:600px){.cal-s{display:none}}
.about{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px;text-align:center}
.about h2{margin:8px 0 0;font-size:24px}
.about p{margin:0;color:var(--fg2)}

.store{flex:1;overflow:auto;padding:22px;min-width:0}
.hero{border-radius:16px;padding:26px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;margin-bottom:22px;background-size:cover}
.hero small{opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:11px}
.hero h2{margin:0;font-size:28px;line-height:1.1}
.sapp{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sapp>svg{width:60px;height:60px;flex:none}
.sapp .tx{flex:1;min-width:0}
.sapp b{display:block;font-size:14px}.sapp span{color:var(--fg2);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;padding:4px 18px;min-width:70px;height:26px;flex:none;position:relative}
.get.ghost{background:var(--strong);color:var(--fg)}
.ring{width:26px;height:26px;display:block}
.stars{color:#ff9f0a;letter-spacing:1px}
.shots{display:flex;gap:12px;overflow:auto;padding:6px 0 12px}
.shots div{flex:none;width:200px;height:130px;border-radius:10px}

.cvs{flex:1;display:flex;flex-direction:column;min-width:0}
.cvs canvas{flex:1;min-height:0;width:100%;background:#fff;touch-action:none}
.pal{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pal i{width:20px;height:20px;border-radius:50%;border:2px solid var(--win);outline:2px solid transparent;flex:none}
.pal i.on{outline-color:var(--fg2)}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;font-weight:700;backdrop-filter:blur(3px)}
.mine-g{display:grid;gap:2px;padding:10px;background:var(--field);border-radius:8px}
.mcell{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;background:var(--strong);font-weight:700;font-size:14px;user-select:none}
.mcell.o{background:var(--win)}
.tile{border-radius:6px;display:grid;place-items:center;font-weight:800;transition:background .12s}
.musicb{flex:1;display:flex;flex-direction:column;min-width:0}
.tr{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:8px}
.tr.on{background:var(--hover)}
.tr .art{width:38px;height:38px;border-radius:6px;flex:none}
.tr small{color:var(--fg2);display:block}
.prog{height:4px;border-radius:4px;background:var(--strong);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--fg2);width:0}
.ptable{width:100%;border-collapse:collapse}
.ptable th{text-align:left;font-weight:500;color:var(--fg2);padding:5px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:4px 10px}
.ptable tr.sel td{background:var(--accent);color:#fff}
.rem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.rem i{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg2);flex:none;display:block}
.rem.done i{background:var(--accent);border-color:var(--accent)}
.rem.done span{color:var(--fg2);text-decoration:line-through}
.tabs{display:flex;gap:2px;background:var(--field);border-radius:8px;padding:2px;margin:0 auto}
.tabs button{border:0;background:none;padding:2px 14px;border-radius:6px;font-weight:500}
.tabs button.on{background:var(--win);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bigt{font-size:54px;font-weight:200;font-variant-numeric:tabular-nums;text-align:center;padding:26px 0 10px}
.browser-start{flex:1;overflow:auto;padding:36px 28px;display:flex;flex-direction:column;align-items:center;gap:22px;background:var(--win)}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:18px;width:min(560px,100%)}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);text-decoration:none;font-size:12px}
.fav i{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.25)}
/* dock: pobieranie, upuszczanie w koszu */
.webapp{flex:1;position:relative;display:flex;min-width:0;background:var(--win)}
.wsplash{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;color:var(--fg2);font-weight:600}
.wsplash img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.dk .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ff3b30;color:#fff;font:700 11.5px/19px var(--font);text-align:center;font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.dk.dling svg.app{opacity:.5;filter:grayscale(.7)}
.dlr{position:absolute;inset:0;display:grid;place-items:center;border-radius:22%;background:rgba(0,0,0,.28);pointer-events:none}
.dk.over{transform:scale(1.28) translateY(-6px);transition:transform .15s}
.dk.over svg.app{filter:drop-shadow(0 0 12px var(--accent))}
#dock .dk svg.app{border-radius:22%}
#menubar{border-bottom:.5px solid rgba(128,128,128,.18);box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.mi{font-weight:500}
.mi.b{font-weight:800}
/* przeglądarka: karty i zakładki */
.btabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;flex:none}
.btab{display:flex;align-items:center;gap:6px;max-width:180px;min-width:70px;flex:1 1 150px;padding:5px 8px;border-radius:8px 8px 0 0;font-size:12px;white-space:nowrap;overflow:hidden;transition:max-width .17s,min-width .17s,flex-basis .17s,opacity .17s,padding .17s}
.btab:hover{background:var(--hover)}
.btab.on{background:var(--win)}
.btab img,.btab i,.bmarks img,.bmarks i{width:14px;height:14px;border-radius:4px;flex:none;font-size:9px;display:grid;place-items:center;background:var(--strong);font-style:normal;object-fit:cover}
.btab span{flex:1;overflow:hidden;text-overflow:ellipsis}
.btab button{border:0;background:none;width:16px;height:16px;border-radius:50%;line-height:1;padding:0;color:var(--fg2);flex:none}
.btab button:hover{background:var(--strong)}
.btab.closing{max-width:0;min-width:0;flex-basis:0;padding-left:0;padding-right:0;opacity:0}
.btnew{border:0;background:none;width:26px;flex:none;border-radius:6px;font-size:16px;color:var(--fg2)}
.btnew:hover{background:var(--hover)}
.bmarks{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);overflow-x:auto;font-size:12px;flex:none}
.bmarks button{display:flex;align-items:center;gap:5px;border:0;background:none;padding:2px 8px;border-radius:6px;white-space:nowrap}
.bmarks button:hover{background:var(--hover)}
.fav .fi{width:60px;height:60px;border-radius:14px;overflow:hidden;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);background:var(--field)}
.fav .fi img{width:100%;height:100%;object-fit:cover;border-radius:0}
.fav .fi i{width:100%;height:100%;border-radius:0;font-size:22px;font-weight:700}
/* animacje: menu, okna, przyciski, ekran logowania */
.dropdown{transform-origin:top left;animation:menuin .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes menuin{from{opacity:0;transform:scale(.93) translateY(-5px)}to{opacity:1;transform:none}}
.btn,.tbtn,.bar button,.get,.tabs button{transition:background .15s,transform .1s,filter .15s}
.btn:active,.tbtn:active,.bar button:active,.get:active{transform:scale(.95)}
.win{transition:transform .45s cubic-bezier(.3,.8,.2,1),opacity .25s,box-shadow .3s}
.sl,.dd,.mi,.nl,.tr,.sr,.cc-row{transition:background .14s}
.it{transition:background .14s,transform .15s}.it:hover{transform:translateY(-1px)}
.di{transition:background .14s,transform .15s}.di:hover{transform:scale(1.04)}
.sw{transition:background .2s}
.set>*{animation:fadein .28s both}
.li{animation:pop .38s cubic-bezier(.2,.9,.3,1.25) both}
#spot .box{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
#screen{transition:opacity .5s,transform .6s}
#screen.fade{transform:scale(1.08)}
#desk.enter{animation:deskin .85s cubic-bezier(.2,.8,.2,1)}
@keyframes deskin{from{transform:scale(1.06);filter:blur(6px)}to{transform:none;filter:none}}
.wallfade{position:absolute;inset:0;transition:opacity .8s ease;z-index:0;pointer-events:none}
#desk.anim{background-size:230% 230%;animation:wallmove 46s ease-in-out infinite alternate}
#desk.anim.enter{animation:deskin .85s cubic-bezier(.2,.8,.2,1),wallmove 46s ease-in-out infinite alternate}
@keyframes wallmove{from{background-position:0% 10%}to{background-position:100% 90%}}
/* Miri: panel, ikona, aplikacja */
#miri{position:fixed;top:36px;right:12px;width:350px;max-width:calc(100vw - 24px);padding:18px 16px 14px;border-radius:26px;background:linear-gradient(180deg,rgba(26,18,52,.88),rgba(12,16,40,.9));color:#fff;backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 0 0 .5px rgba(255,255,255,.2);z-index:845;text-align:center;transform-origin:calc(100% - 90px) 0;animation:miriin .42s cubic-bezier(.2,.9,.3,1.18)}
#miri.out{animation:miriout .22s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes miriin{from{opacity:0;transform:scale(.4) translateY(-10px)}to{opacity:1;transform:none}}
@keyframes miriout{to{opacity:0;transform:scale(.5) translateY(-10px)}}
#miri canvas.orb{width:132px;height:132px;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 26px rgba(80,120,255,.55))}
#miri .mstat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600;min-height:16px}
#miri .mtr{font-size:15px;min-height:20px;margin:6px 0;opacity:.85;font-style:italic;overflow-wrap:anywhere}
#miri .mrep{font-size:15.5px;line-height:1.45;margin:6px 0 10px;text-align:left;max-height:34vh;overflow:auto;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
#miri .mrep:empty{display:none}
#miri .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
#miri .chips button{border:0;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.12);color:#fff;font-size:12.5px}
#miri .chips button:hover{background:rgba(255,255,255,.22)}
#miri form{display:flex;gap:8px;align-items:center}
#miri input{flex:1;min-width:0;border:0;outline:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.12);color:#fff;font:inherit;user-select:text;-webkit-user-select:text}
#miri input::placeholder{color:rgba(255,255,255,.55)}
#miri .rb{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
#miri .rb.on{background:linear-gradient(135deg,#ff3fb4,#3a7bff)}
#miri .mfoot{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
#miri .mfoot button{border:0;background:none;color:rgba(255,255,255,.7);padding:3px 6px;border-radius:6px}
#miri .mfoot button:hover{background:rgba(255,255,255,.12);color:#fff}
#miribtn canvas{width:18px;height:18px;display:block}
.mchat{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mb{max-width:78%;padding:9px 13px;border-radius:18px;line-height:1.42;user-select:text;-webkit-user-select:text;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .25s both}
.mb.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.mb.a{align-self:flex-start;background:var(--field);border-bottom-left-radius:6px}
.mtype i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg2);margin:0 2px;animation:blink 1s infinite}
.mtype i:nth-child(2){animation-delay:.15s}.mtype i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.minput{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.minput input{flex:1;border:0;border-radius:999px;background:var(--field);color:var(--fg);padding:8px 14px;outline:0;font:inherit;min-width:0}
.mhead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.mhead canvas{width:30px;height:30px;flex:none}
.mhead select{border:0;border-radius:6px;background:var(--field);color:var(--fg);padding:3px 8px}
.mset{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--sidebar)}
.mset textarea{width:100%;min-height:54px;border:0;border-radius:8px;background:var(--field);color:var(--fg);padding:8px 10px;font:inherit;resize:vertical;user-select:text}
.mwelcome{margin:auto;text-align:center;color:var(--fg2);max-width:300px}
.mwelcome canvas{width:96px;height:96px;display:block;margin:0 auto 10px}
/* tapety i muzyka */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.wg{display:flex;flex-direction:column;gap:5px;align-items:center;border:0;background:none;padding:0;font-size:11.5px}
.wg i{display:block;width:100%;aspect-ratio:16/10;border-radius:8px;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.25);background-size:cover;background-position:center;transition:transform .15s,border-color .15s}
.wg:hover i{transform:scale(1.04)}
.wg.on i{border-color:var(--accent)}
.mnow{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mnow .big{width:84px;height:84px;border-radius:14px;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mnow.playing .big{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) scale(1.03)}}
.tr .eq{display:none;gap:2px;align-items:flex-end;height:14px}
.tr.on.playing .eq{display:flex}
.tr .eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.tr .eq i:nth-child(2){animation-delay:.2s}.tr .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.tr .tag{font-size:10px;border-radius:4px;padding:0 5px;background:var(--strong);margin-left:6px;color:var(--fg2)}
.mctl button.on{background:var(--strong)}
.eqm{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.eqm i{width:3px;background:currentColor;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eqm i:nth-child(2){animation-delay:.2s}.eqm i:nth-child(3){animation-delay:.4s}
.mxn{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin-left:6px}
@media (max-width:900px){.mxn{display:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.win,.dk,.dk.bounce,.banner{animation:none!important;transition:none!important}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('mw_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mw_'+k,JSON.stringify(v))}catch(e){}}};
const root=document.documentElement, MB=28;
const small=()=>innerWidth<600;
let uid=0;
const bus=new EventTarget();
const emit=(n,d)=>bus.dispatchEvent(new CustomEvent(n,{detail:d}));
const on=(n,f)=>{const h=e=>f(e.detail);bus.addEventListener(n,h);return()=>bus.removeEventListener(n,h)};
const pad=n=>String(n).padStart(2,'0');
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1).replace('.',',')+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
const fmtDate=t=>new Date(t).toLocaleString('pl-PL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

/* ---------- logo systemu (własny znak, podmień SVG poniżej na swój) ---------- */
const LOGO_MARK=(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><circle cx="19.2" cy="4.8" r="1.6" fill="currentColor" stroke="none"/></svg>`;
/* Ikony SVG nie mają zastępczego znaku, gdy obraz się nie wczyta, więc najpierw sprawdzamy, czy logo.png istnieje. */
let LOGO_LOADED=false, MIRI_LOADED=false;
function probeImg(src,done){const t=new Image();t.onload=()=>{done();emit('assets')};t.src=src}
probeImg('logo.png',()=>{LOGO_LOADED=true});
probeImg('sirilogo.jpg',()=>{MIRI_LOADED=true});
/* Miejsce na logo: jeśli obok pliku HTML leży logo.png, jest pokazywane zamiast wbudowanego znaku. */
const LOGO=(s=14)=>`<span class="lgo" style="width:${s}px;height:${s}px">${LOGO_MARK(s).replace(/width="\d+" height="\d+"/,'width="100%" height="100%"')}<img src="logo.png" alt="" onload="this.parentNode.classList.add('has')" onerror="this.remove()"></span>`;

/* efekt „genie”: okno zwęża się lejkiem i wsuwa w ikonę w docku */
function genie(w,out){
  const dk=dockEl(w.id), r=w.el.getBoundingClientRect(); let cx=innerWidth/2, cy=innerHeight-30, iw=44;
  if(dk){const k=dk.getBoundingClientRect();cx=k.left+k.width/2;cy=k.top+k.height/2;iw=k.width}
  const tx=cx-(r.left+r.width/2), ty=cy-(r.top+r.height/2), maxIn=.5*(1-Math.min(1,iw/r.width));
  const N=16, steps=12, fr=[];
  const poly=p=>{
    const inset=f=>(maxIn*Math.pow(f,1.7)*p).toFixed(3), pts=[];
    for(let i=0;i<=N;i++){const f=i/N;pts.push(`${(inset(f)*100).toFixed(2)}% ${(f*100).toFixed(2)}%`)}
    for(let i=N;i>=0;i--){const f=i/N;pts.push(`${((1-inset(f))*100).toFixed(2)}% ${(f*100).toFixed(2)}%`)}
    return 'polygon('+pts.join(',')+')';
  };
  for(let i=0;i<=steps;i++){
    const p=i/steps, e=p*p*(3-2*p);
    fr.push({offset:p,transform:`translate(${(tx*e).toFixed(1)}px,${(ty*e).toFixed(1)}px) scale(${(1-.93*e).toFixed(3)},${(1-.96*e).toFixed(3)})`,clipPath:poly(Math.min(1,p*1.6)),opacity:p>.88?Math.max(0,1-(p-.88)*8):1});
  }
  const frames=out?fr:fr.slice().reverse().map((f,i)=>Object.assign({},f,{offset:i/steps}));

  s.innerHTML='<div class="box"><div class="q"><svg class="ico" width="24" height="24" viewBox="0 0 15 15" style="color:var(--fg2)"><circle cx="6.3" cy="6.3" r="4.6"/><path d="m10 10 3.6 3.6"/></svg><input id="spi" placeholder="Spotlight" autocomplete="off" spellcheck="false" aria-label="Spotlight"></div><div class="res" id="spr"></div></div>';

  const p=el('div'); p.id='cc';
  const tile=(id,ico,t,sub,onv)=>`<button class="cc-row" id="${id}"><span class="pill ${onv?'':'off'}">${ico}</span><span><b>${t}</b><small>${sub}</small></span></button>`;

  p.innerHTML=`<div class="cc-grid">${tile('cc-wifi','<svg class="ico" width="16" height="14" viewBox="0 0 17 14"><path d="M1.5 5a10 10 0 0 1 14 0M4 7.8a6.4 6.4 0 0 1 9 0M6.4 10.4a3 3 0 0 1 4.2 0"/></svg>','Wi-Fi',S.wifi?'Włączone':'Wyłączone',S.wifi)}${tile('cc-bt','<svg class="ico" width="14" height="16" viewBox="0 0 14 16"><path d="m3 4.5 8 7-4 3.500V1.500l4 3.500-8 7"/></svg>','Bluetooth',S.bt?'Włączony':'Wyłączony',S.bt)}${tile('cc-dark','<svg class="ico" width="16" height="16" viewBox="0 0 16 16"><path d="M13 9.500A5.500 5.500 0 0 1 6.500 3 5.500 5.500 0 1 0 13 9.500z"/></svg>','Tryb ciemny',isDark()?'Wł.':'Wył.',isDark())}${tile('cc-dnd','<svg class="ico" width="16" height="16" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 6 6"/></svg>','Nie przeszkadzać',S.dnd?'Wł.':'Wył.',S.dnd)}</div>
  <div class="cc-sl"><label for="br">Jasność</label><input type="range" id="br" min="30" max="100" value="${S.brightness}"></div>
  <div class="cc-sl"><label for="vo">Dźwięk</label><input type="range" id="vo" min="0" max="100" value="${S.volume}"></div>
  ${np?`<div class="cc-sl" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(TRACKS[Music.cur].name)}</b><small style="color:var(--fg2)">${esc(TRACKS[Music.cur].artist)}</small></div><button class="tbtn" id="cc-pp">${Music.playing?'Pauza':'Odtwórz'}</button></div>`:''}`;
  document.body.append(p);
  const rerender=()=>{p.remove();$('#ccbtn').click()};
  $('#cc-wifi').onclick=()=>{S.wifi=!S.wifi;saveS();wifiDraw();rerender()};
  $('#cc-bt').onclick=()=>{S.bt=!S.bt;saveS();rerender()};
  $('#cc-dark').onclick=()=>{toggleTheme();rerender()};
  $('#cc-dnd').onclick=()=>{S.dnd=!S.dnd;saveS();rerender()};

/* ---------- ekran: start, logowanie, uśpienie, wyłączenie ---------- */
const scr=$('#screen'); let sessionOn=false;
function setScreen(cls,html){scr.hidden=false;scr.className=cls;scr.innerHTML=html}
const IC_SLEEP='<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 9.500A5.500 5.500 0 0 1 6.500 3 5.500 5.500 0 1 0 13 9.500z"/></svg>';
const IC_RESTART='<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.500-3.500M13 2.500v3h-3"/></svg>';
const IC_POWER='<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.500v6M4.500 4a5.500 5.500 0 1 0 7 0"/></svg>';
function boot(){
  setScreen('boot',`<div class="bl">${LOGO(76)}</div><div class="bar"><i></i></div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=$('.bar i',scr);if(i)i.style.width='100%'}));
  setTimeout(()=>{if(scr.classList.contains('boot'))login()},3100);
}
function login(){
  closeMenus(); const d=new Date();
  setScreen('login',`<div class="big"><b>${pad(d.getHours())}:${pad(d.getMinutes())}</b><span>${d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</span></div>
  <div class="av" style="background:${S.avatar}">${esc((S.user[0]||'G').toUpperCase())}</div><div class="nm">${esc(S.user)}</div>
  <div class="pw"><input type="password" placeholder="Wpisz hasło" autocomplete="off" aria-label="Hasło"><button aria-label="Zaloguj">→</button></div>
  <div class="hint">Wpisz dowolne hasło albo naciśnij Enter</div>
  <div class="pwr"><button data-a="sleep"><i>${IC_SLEEP}</i>Uśpij</button><button data-a="restart"><i>${IC_RESTART}</i>Uruchom ponownie</button><button data-a="shut"><i>${IC_POWER}</i>Wyłącz</button></div>`);
  const i=$('input',scr); setTimeout(()=>i.focus(),50);
  i.onkeydown=e=>{if(e.key==='Enter')unlock()}; $('.pw button',scr).onclick=unlock;
  $$('.pwr button',scr).forEach(b=>b.onclick=()=>({sleep:sleepNow,restart:()=>doPower('restart'),shut:()=>doPower('shutdown')})[b.dataset.a]());
}
function unlock(){
  sfx('chime'); scr.classList.add('fade');
  if(S.autoFs&&!document.fullscreenElement)toggleFullscreen();
  const dk=$('#desk'); dk.classList.remove('enter'); void dk.offsetWidth; dk.classList.add('enter'); setTimeout(()=>dk.classList.remove('enter'),900);
  if(S.miri.wake)setTimeout(()=>miriStartWake(),1200);
  setTimeout(()=>{scr.hidden=true;scr.className='';scr.innerHTML=''},520);
  if(!sessionOn){sessionOn=true;startSession()}
}
function startSession(){
  openApp('finder'); setTimeout(()=>notify('Witaj, '+S.user,'System jest gotowy. Naciśnij Ctrl + Spacja, aby wyszukać.','finder'),900);
  if(storeTodo().length)setTimeout(()=>notify('Nowe w App Store','Pobierz Work Docs, Math Docs, Wykresy i Pay Buddy. Kliknij, aby otworzyć.','appstore',()=>openApp('appstore')),5600);
}
function wakeOnce(next){
  setTimeout(()=>{
    const h=()=>{scr.removeEventListener('pointerdown',h);removeEventListener('keydown',h,true);next()};
    scr.addEventListener('pointerdown',h);addEventListener('keydown',h,true);
  },700);
}
function offScreen(){
  setScreen('off','<div class="offhint">Kliknij lub naciśnij dowolny klawisz, aby włączyć komputer</div>');
  wakeOnce(()=>{sfx('chime');boot()});
}
function sleepNow(){closeMenus();if(Music&&Music.playing)musicToggle();setScreen('sleep','');wakeOnce(login)}
function shutting(then){setScreen('shut',`<div class="bl">${LOGO(76)}</div><div class="spin"></div>`);setTimeout(then,1800)}
function doPower(kind){
  closeMenus(); closeLaunchpad(); closeSpot(); sfx('down');
  musicStop(); closeAll(); sessionOn=false;
  if(kind==='logout'){setTimeout(login,500);return}
  setTimeout(()=>shutting(()=>kind==='restart'?boot():offScreen()),650);
}
function confirmPower(kind){
  const t={restart:['Czy na pewno chcesz teraz uruchomić ponownie komputer?','Uruchom ponownie','zostanie uruchomiony ponownie'],shutdown:['Czy na pewno chcesz teraz wyłączyć komputer?','Wyłącz','zostanie wyłączony'],logout:['Czy na pewno chcesz wylogować użytkownika '+S.user+'?','Wyloguj','wyloguje użytkownika']}[kind];
  let n=60, done=false;
  const msg=()=>kind==='logout'?'Wylogowanie nastąpi automatycznie za '+n+' s.':'Jeśli nic nie zrobisz, komputer '+t[2]+' automatycznie za '+n+' s.';
  const dlg=dialog({title:t[0],msg:msg(),ic:icon('about'),buttons:[{label:'Anuluj',cancel:true,cb:()=>{done=true;clearInterval(iv)}},{label:t[1],primary:true,cb:()=>{done=true;clearInterval(iv);doPower(kind)}}]});
  const iv=setInterval(()=>{if(done)return clearInterval(iv);n--;dlg.setMsg(msg());if(n<=0){clearInterval(iv);dlg.close();doPower(kind)}},1000);
}
function forceQuit(){
  const ids=[...new Set([...wins.values()].map(w=>w.id))]; let sel=ids[0];
  const body=el('div'); body.style.cssText='margin-top:10px;border:1px solid var(--line);border-radius:8px;max-height:160px;overflow:auto';
  const draw=()=>{body.innerHTML='';ids.forEach(id=>{const r=el('div','sl'+(id===sel?' on':''),'<span style="width:20px;height:20px;display:block">'+icon(id)+'</span><span></span>');$('span:last-child',r).textContent=APPS[id].name;r.onclick=()=>{sel=id;draw()};body.append(r)});if(!ids.length)body.textContent='Brak uruchomionych aplikacji.'};
  draw();
  dialog({title:'Wymuś zakończenie programu',msg:'Wybierz aplikację do zamknięcia.',body,buttons:[{label:'Anuluj',cancel:true},{label:'Wymuś zakończenie',primary:true,cb:()=>{if(sel)winsOf(sel).forEach(closeWin)}}]});
}

/* ---------- pulpit: ikony, menu kontekstowe, upuszczanie plików ---------- */
function drawIcons(){
  const box=$('#icons'); box.innerHTML='';
  const items=[['MGS HD','/',{t:'d',disk:1}],...VFS.list(HOME+'/Desktop').filter(([n])=>!n.startsWith('.')).map(([n,node])=>[n,HOME+'/Desktop/'+n,node])];
  items.forEach(([n,p,node])=>{
    const ico=node.disk?diskSVG:node.t==='d'?folderSVG:node.k==='app'?icon(node.app):fileSVG(node.k==='img'?'img':'doc');
    const d=el('div','di',ico+'<span></span>'); $('span',d).textContent=n; d.draggable=!node.disk; d.dataset.path=p;
    d.onclick=e=>{e.stopPropagation();$$('.di').forEach(x=>x.classList.remove('sel'));d.classList.add('sel')};
    d.ondblclick=()=>openNode(p);
    d.ondragstart=e=>{e.dataTransfer.setData('text/x-path',p);e.dataTransfer.effectAllowed='move'};
    d.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();d.click();popMenu([['Otwórz',()=>openNode(p)],...(node.disk?[]:[['Przenieś do kosza',()=>trashPath(p)]])],e.clientX,e.clientY)};
    box.append(d);
  });
}
function newItem(dir,kind){
  const isDir=kind==='dir';
  dialog({title:isDir?'Nowy folder':'Nowy dokument tekstowy',msg:'Podaj nazwę.',input:'Nazwa',value:isDir?'Nowy folder':'Bez tytułu.txt',buttons:[{label:'Anuluj',cancel:true},{label:'Utwórz',primary:true,cb:v=>{
    v=(v||'').trim().replace(/\//g,'-'); if(!v)return false;
    try{isDir?VFS.mkdir(dir+'/'+v):VFS.write(dir+'/'+v,'')}catch(e){notify('Nie można utworzyć',e.message,'finder')}
  }}]});
}
$('#desk').addEventListener('contextmenu',e=>{
  if(e.target.closest('.win,#dock,#menubar,.di'))return;
  e.preventDefault(); popMenu([['Nowy folder',()=>newItem(HOME+'/Desktop','dir')],['Nowy dokument tekstowy',()=>newItem(HOME+'/Desktop','file')],'-',['Zapytaj Miri…',()=>miriOpen({focus:true})],['Otwórz Terminal',()=>openApp('terminal',{new:true})],['Zmień tapetę…',()=>openApp('settings',{pane:'wall'})]],e.clientX,e.clientY);
});
$('#desk').addEventListener('click',e=>{if(!e.target.closest('.di'))$$('.di').forEach(x=>x.classList.remove('sel'))});
$('#desk').addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/x-path'))e.preventDefault()});
$('#desk').addEventListener('drop',e=>{
  const p=e.dataTransfer.getData('text/x-path'); if(!p)return; e.preventDefault();
  try{VFS.mv(p,HOME+'/Desktop')}catch(err){notify('Nie można przenieść',err.message,'finder')}
});
on('fs',drawIcons);
on('assets',()=>{refreshDock();buildMenubar();drawIcons()});

/* ---------- skróty klawiszowe ---------- */
addEventListener('keydown',e=>{
  if(!scr.hidden)return;
  if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();$('#spot')?closeSpot():openSpot()}
  else if(e.key==='F3'||(e.ctrlKey&&e.key==='ArrowUp'&&!e.target.closest('textarea,input'))){e.preventDefault();toggleMC()}
  else if(e.key==='F4'){e.preventDefault();openLaunchpad()}
  else if(e.key==='Escape'){closeMenus();closeSpot();closeLaunchpad();exitMC();miriClose()}
});

/* ---------- otwieranie elementów systemu plików ---------- */
function openNode(p){
  const n=VFS.get(p); if(!n)return; const name=p.split('/').pop();
  if(p==='/'||n.t==='d')return openApp('finder',{path:p});
  if(n.k==='app')return openApp(n.app);
  if(n.k==='img'||['png','jpg','jpeg','gif','webp'].includes(extOf(name)))return openApp('preview',{file:p});
  if(n.k==='bin')return dialog({title:'Nie można otworzyć „'+name+'”',msg:'Ten typ pliku nie jest obsługiwany w tym systemie.',buttons:[{label:'OK',primary:true}]});
  openApp('textedit',{file:p});
}

function renderFinder(body,w,opts){
  let path=opts.path||HOME+'/Desktop', hist=[], fwd=[], view=store.get('fview','icon'), q='', sel=new Set();
  const side=el('div','side'), main=el('div','main'), bar=el('div','bar'), content=el('div','fcont'), st=el('div','status');
  content.style.cssText='flex:1;display:flex;flex-direction:column;min-height:0'; content.tabIndex=0;
  const back=el('button','','‹'), fw=el('button','','›'), title=el('span'), sp=el('span','sp');
  const vi=el('button','','▦'), vl=el('button','','☰'), search=el('input'); search.placeholder='Szukaj'; search.setAttribute('aria-label','Szukaj w folderze');
  const trashBtn=el('button','','Opróżnij kosz');
  back.setAttribute('aria-label','Wstecz'); fw.setAttribute('aria-label','Dalej'); vi.title='Jako ikony'; vl.title='Jako lista';
  bar.append(back,fw,title,sp,trashBtn,vi,vl,search); main.append(bar,content,st); body.append(side,main);
  const inTrash=()=>path===TRASH||path.startsWith(TRASH+'/');
  const base=p=>p==='/'?'':p.split('/').pop();
  const full=n=>(path==='/'?'':path)+'/'+n;
  function go(p,push=true){
    p=VFS.norm(p); const n=VFS.get(p); if(!n||n.t!=='d')return;
    if(push){hist.push(path);fwd=[]} path=p; sel.clear(); q=''; search.value=''; draw();
  }
  function entries(){
    let l=VFS.list(path); if(!inTrash())l=l.filter(([n])=>!n.startsWith('.'));
    if(q)l=l.filter(([n])=>n.toLowerCase().includes(q)); return l;
  }
  const iconFor=(n,node)=>node.t==='d'?folderSVG:node.k==='app'?icon(node.app):node.k==='img'?`<div class="ph">${imgHTML(node)}</div>`:fileSVG('doc');
  function moveInto(paths,dir){
    paths.forEach(p=>{if(dir===TRASH)return trashPath(p);try{VFS.mv(p,dir)}catch(e){notify('Nie można przenieść',e.message,'finder')}});
  }
  function itemMenu(name,node,e){
    const p=full(name);
    const items=[['Otwórz',()=>openNode(p)],'-',['Kopiuj',()=>{fileClip=p}],['Zmień nazwę…',()=>rename(name)],['Informacje',()=>info(name,node)],'-'];
    if(inTrash()){items.push(['Usuń natychmiast',()=>{sfx('trash');VFS.rm(p,true)}]);items.push(['Włóż z powrotem na Pulpit',()=>VFS.mv(p,HOME+'/Desktop')])}
    else items.push(['Przenieś do kosza',()=>trashSel(name)]);
    popMenu(items,e.clientX,e.clientY);
  }
  function trashSel(name){
    const names=sel.has(name)?[...sel]:[name];
    names.forEach(n=>trashPath(full(n)));
  }
  function rename(name){
    dialog({title:'Zmień nazwę',msg:'Podaj nową nazwę.',input:'Nazwa',value:name,buttons:[{label:'Anuluj',cancel:true},{label:'Zmień',primary:true,cb:v=>{
      v=(v||'').trim().replace(/\//g,'-'); if(!v||v===name)return;
      try{if(VFS.get(full(v)))throw new Error('Element o takiej nazwie już istnieje');VFS.mv(full(name),full(v))}catch(e){notify('Nie można zmienić nazwy',e.message,'finder')}
    }}]});
  }
  function info(name,node){
    const sz=VFS.size(node), kind=node.t==='d'?'Folder':node.k==='app'?'Aplikacja':node.k==='img'?'Obraz':'Dokument';
    dialog({title:name,msg:`Rodzaj: ${kind}\nRozmiar: ${fmtSize(sz)}\nZmodyfikowano: ${fmtDate(node.m)}\nŚcieżka: ${full(name)}`,ic:node.t==='d'?folderSVG:node.k==='app'?icon(node.app):fileSVG('doc'),buttons:[{label:'OK',primary:true}]});
  }
  function bgMenu(e){
    popMenu([['Nowy folder',()=>newItem(path,'dir')],['Nowy dokument tekstowy',()=>newItem(path,'file')],'-',['Wklej',()=>{try{VFS.cp(fileClip,path,true)}catch(er){notify('Nie można wkleić',er.message,'finder')}},'',{off:!fileClip}],'-',['Jako ikony',()=>setView('icon'),'',{chk:view==='icon'}],['Jako listę',()=>setView('list'),'',{chk:view==='list'}]],e.clientX,e.clientY);
  }
  function setView(v){view=v;store.set('fview',v);draw()}
  function bind(row,name,node){
    const p=full(name);
    row.onclick=e=>{e.stopPropagation();content.focus();if(e.ctrlKey||e.metaKey){sel.has(name)?sel.delete(name):sel.add(name)}else{sel.clear();sel.add(name)}paintSel()};
    row.ondblclick=()=>{if(node.t==='d'&&!inTrash())go(p);else if(node.t==='d')go(p);else openNode(p)};
    row.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();if(!sel.has(name)){sel.clear();sel.add(name);paintSel()}itemMenu(name,node,e)};
    row.draggable=true;
    row.ondragstart=e=>{const ps=(sel.has(name)?[...sel]:[name]).map(full);e.dataTransfer.setData('text/x-path',ps.join('\n'));e.dataTransfer.effectAllowed='move'};
    if(node.t==='d'){
      row.ondragover=e=>{if(e.dataTransfer.types.includes('text/x-path')){e.preventDefault();e.stopPropagation();row.classList.add('drop')}};
      row.ondragleave=()=>row.classList.remove('drop');
      row.ondrop=e=>{e.preventDefault();e.stopPropagation();row.classList.remove('drop');moveInto(e.dataTransfer.getData('text/x-path').split('\n').filter(Boolean),p)};
    }
    row.dataset.name=name;
  }
  function paintSel(){
    $$('[data-name]',content).forEach(r=>r.classList.toggle('sel',sel.has(r.dataset.name)));
    const t=entries().length; st.textContent=sel.size?`Wybrano ${sel.size} z ${t}`:t+(t===1?' element':' elementy');
  }
  function draw(){

      const s=el('div','sl'+(path===p?' on':''),`<svg viewBox="0 0 16 16">${ico}</svg><span></span>`); $('span',s).textContent=label; s.onclick=()=>go(p);
      s.ondragover=e=>{if(e.dataTransfer.types.includes('text/x-path')){e.preventDefault();s.classList.add('drop')}}; s.ondragleave=()=>s.classList.remove('drop');
      s.ondrop=e=>{e.preventDefault();s.classList.remove('drop');moveInto(e.dataTransfer.getData('text/x-path').split('\n').filter(Boolean),p)}; side.append(s);
    };
    side.append(el('h6','','Ulubione'));
    [['Desktop','Pulpit'],['Documents','Dokumenty'],['Downloads','Pobrane'],['Pictures','Zdjęcia'],['Music','Muzyka']].forEach(([k,l])=>mk(l,HOME+'/'+k,sideIco[k]));
    mk('Aplikacje','/Applications',sideIco.Applications);
    side.append(el('h6','','Lokalizacje')); mk('MGS HD','/',sideIco.disk); mk('Kosz',TRASH,sideIco.trash);
    title.textContent=dn(base(path)); w.title(dn(base(path)));
    back.disabled=!hist.length; fw.disabled=!fwd.length; trashBtn.hidden=!(path===TRASH); trashBtn.disabled=!trashFull();
    vi.classList.toggle('on',view==='icon'); vl.classList.toggle('on',view==='list');
    content.innerHTML=''; const l=entries();
    if(!l.length){content.append(el('div','empty',q?'Brak wyników':path===TRASH?'Kosz jest pusty':'Ten folder jest pusty'))}
    else if(view==='icon'){
      const g=el('div','grid'); l.forEach(([n,node])=>{const it=el('div','it',iconFor(n,node)+'<span></span>');$('span',it).textContent=dn(n);bind(it,n,node);g.append(it)}); content.append(g);
    }else{
      const lst=el('div','lst'); const t=el('table'); t.innerHTML='<thead><tr><th>Nazwa</th><th>Data modyfikacji</th><th>Rozmiar</th><th>Rodzaj</th></tr></thead>'; const tb=el('tbody');
      l.forEach(([n,node])=>{const r=el('tr','',`<td>${node.t==='d'?folderSVG:node.k==='app'?icon(node.app):fileSVG(node.k==='img'?'img':'doc')}<span></span></td><td>${fmtDate(node.m)}</td><td>${node.t==='d'?'—':fmtSize(VFS.size(node))}</td><td>${node.t==='d'?'Folder':node.k==='app'?'Aplikacja':node.k==='img'?'Obraz':'Dokument'}</td>`);$('span',r).textContent=dn(n);bind(r,n,node);tb.append(r)});
      t.append(tb); lst.append(t); content.append(lst);
    }
    content.oncontextmenu=e=>{e.preventDefault();bgMenu(e)};
    content.onclick=()=>{sel.clear();paintSel()};
    content.ondragover=e=>{if(e.dataTransfer.types.includes('text/x-path'))e.preventDefault()};
    content.ondrop=e=>{e.preventDefault();moveInto(e.dataTransfer.getData('text/x-path').split('\n').filter(Boolean),path)};
    paintSel();
  }
  content.onkeydown=e=>{
    if(e.key==='Enter'&&sel.size)openNode(full([...sel][0]));

  fw.onclick=()=>{if(fwd.length){hist.push(path);go(fwd.pop(),false)}};

  w.menu=[['Nowy folder',()=>newItem(path,'dir'),'⇧⌘N'],['Nowy dokument tekstowy',()=>newItem(path,'file')]];

}

/* ================= EDYTOR TEKSTU ================= */
function renderTextEdit(body,w,opts){
  let file=opts.file||null, dirty=false;
  const main=el('div','main'), bar=el('div','bar'), ta=el('textarea','note mono'); ta.setAttribute('aria-label','Treść dokumentu'); ta.spellcheck=false;
  const bs=el('button','','Zapisz'), ba=el('button','','Zapisz jako…'), bm=el('button','','Aa'), lab=el('span'); lab.style.cssText='font-weight:400;color:var(--fg2)'; bm.title='Czcionka stałej szerokości';
  bar.append(bs,ba,el('span','sp'),lab,bm); main.append(bar,ta); body.append(main);
  if(file){const n=VFS.get(file);ta.value=n&&n.t==='f'?n.d||'':''}
  const upd=()=>{const nm=file?file.split('/').pop():'Bez tytułu';w.title(nm+(dirty?' — edytowany':''));lab.textContent=file?file.replace(HOME,'~'):'Nowy dokument'};
  function save(){
    if(!file)return saveAs();
    try{VFS.write(file,ta.value)}catch(e){notify('Nie można zapisać',e.message,'textedit');return}
    dirty=false; upd();
  }
  function saveAs(){
    dialog({title:'Zapisz jako',msg:'Ścieżka względem folderu domowego.',input:'Documents/nazwa.txt',value:file?file.replace(HOME+'/',''):'Documents/Bez tytułu.txt',buttons:[{label:'Anuluj',cancel:true},{label:'Zapisz',primary:true,cb:v=>{
      v=(v||'').trim(); if(!v)return false; const p=VFS.norm(v,HOME);
      try{VFS.write(p,ta.value);file=p;dirty=false;upd()}catch(e){notify('Nie można zapisać',e.message,'textedit');return false}
    }}]});
  }
  ta.oninput=()=>{dirty=true;upd()};
  ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}};
  bs.onclick=save; ba.onclick=saveAs; bm.onclick=()=>ta.classList.toggle('mono');
  w.cleanups.push(()=>{if(dirty&&file){try{VFS.write(file,ta.value)}catch(e){}}});
  w.menu=[['Zapisz',save,'⌘S'],['Zapisz jako…',saveAs]];
  upd(); setTimeout(()=>ta.focus(),60);
}

/* ================= PODGLĄD ================= */
function renderPreview(body,w,opts){
  let file=opts.file;
  const main=el('div','main'), bar=el('div','bar'), view=el('div');
  view.style.cssText='flex:1;display:grid;place-items:center;background:var(--field);overflow:hidden;padding:18px;min-height:0';
  const pv=el('button','','‹'), nx=el('button','','›'), lab=el('span','sp'); lab.style.cssText='text-align:center;font-weight:600';
  bar.append(pv,nx,lab); main.append(bar,view); body.append(main);
  const dir=()=>VFS.split(file)[0];
  const siblings=()=>VFS.list(dir()).filter(([n,x])=>x.t==='f'&&x.k==='img').map(([n])=>dir()+'/'+n);
  function show(){
    const n=VFS.get(file); if(!n){w.close();return}
    view.innerHTML=`<div style="width:min(100%,640px);aspect-ratio:4/3;max-height:100%;border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)">${imgHTML(n)}</div>`;
    lab.textContent=file.split('/').pop(); w.title(file.split('/').pop());
    const s=siblings(); pv.disabled=nx.disabled=s.length<2;
  }
  const step=d=>{const s=siblings(),i=s.indexOf(file);if(s.length)file=s[(i+d+s.length)%s.length];show()};
  pv.onclick=()=>step(-1); nx.onclick=()=>step(1);
  w.on('fs',()=>{if(!VFS.get(file))w.close();else show()});
  w.onopen=o=>{if(o.file){file=o.file;show()}};
  show();
}

/* przeglądarka z kartami, zakładkami i historią */
function renderBrowser(body,w,opts){
  const main=el('div','main'); body.append(main);
  const tabsBar=el('div','btabs'), bar=el('div','bar'), marks=el('div','bmarks'), view=el('div');
  view.style.cssText='flex:1;display:flex;flex-direction:column;min-height:0;position:relative';
  const back=el('button','','‹'), fw=el('button','','›'), rl=el('button','','↻'), addr=el('input','field'), ext=el('a','tbtn','↗');
  back.setAttribute('aria-label','Wstecz'); fw.setAttribute('aria-label','Dalej'); rl.setAttribute('aria-label','Odśwież'); ext.title='Otwórz w nowej karcie przeglądarki'; ext.setAttribute('aria-label','Otwórz w nowej karcie przeglądarki');
  addr.style.cssText='flex:1;width:auto;text-align:center'; addr.placeholder='Szukaj lub wpisz adres'; addr.setAttribute('aria-label','Pasek adresu');
  ext.style.cssText='display:inline-grid;place-items:center;text-decoration:none;color:var(--fg);visibility:hidden'; ext.target='_blank'; ext.rel='noopener';
  bar.append(back,fw,rl,addr,ext); main.append(tabsBar,bar,marks,view);
  const BM=[['Work Docs','https://workdocs.online'],['Math Docs','https://math.workdocs.online'],['Wykresy','https://wykresy.workdocs.online'],['Pay Buddy','https://paybud.site'],['Wikipedia','https://pl.wikipedia.org'],['MDN','https://developer.mozilla.org'],['OpenStreetMap','https://www.openstreetmap.org']];
  BM.forEach(([n,u])=>{const b=el('button','',favHTML(hostOf(u))+'<span></span>');$('span',b).textContent=n;b.onclick=()=>nav(tab(),u);marks.append(b)});
  let tabs=[], cur=null, tid=0;
  const tab=()=>cur;
  function newTab(url){
    const t={id:++tid,url:null,hist:[null],hi:0,el:el('div'),title:'Nowa karta'}; t.el.style.cssText='flex:1;display:flex;flex-direction:column;min-height:0';
    tabs.push(t); select(t); if(url)nav(t,url); else start(t); return t;
  }
  function select(t){cur=t;view.replaceChildren(t.el);addr.value=t.url?t.url.replace(/^https?:\/\//,''):'';drawTabs();sync()}
  function sync(){
    const t=cur; if(!t)return; back.disabled=t.hi<=0; fw.disabled=t.hi>=t.hist.length-1; rl.disabled=!t.url;
    ext.style.visibility=t.url?'visible':'hidden'; if(t.url)ext.href=t.url; addr.value=t.url?t.url.replace(/^https?:\/\//,''):'';
    w.title((t.title||'Przeglądarka'));
  }
  function drawTabs(){
    tabsBar.innerHTML='';
    tabs.forEach(t=>{
      const host=t.url?hostOf(t.url):'', d=el('div','btab'+(t===cur?' on':''),(host?favHTML(host):'<i>+</i>')+'<span></span><button aria-label="Zamknij kartę">×</button>');
      $('span',d).textContent=t.title; d.onclick=()=>select(t);
      $('button',d).onclick=e=>{e.stopPropagation();closeTab(t,d)}; tabsBar.append(d);
    });
    const p=el('button','btnew','+'); p.setAttribute('aria-label','Nowa karta'); p.onclick=()=>newTab(); tabsBar.append(p);
  }
  function closeTab(t,d){
    d.classList.add('closing');
    setTimeout(()=>{
      const i=tabs.indexOf(t); tabs=tabs.filter(x=>x!==t);
      if(!tabs.length){w.close();return}
      if(cur===t)select(tabs[Math.max(0,i-1)]);else drawTabs();
    },170);
  }
  function start(t){
    t.url=null; t.title='Nowa karta'; t.el.innerHTML='';
    const s=el('div','browser-start'), d=new Date();
    s.innerHTML=`<div style="text-align:center"><div style="font-size:46px;font-weight:200">${pad(d.getHours())}:${pad(d.getMinutes())}</div><div style="color:var(--fg2)">${d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div></div><div class="favs"></div>`;
    const favs=$('.favs',s);
    BM.forEach(([n,u])=>{const a=el('div','fav lnk',`<span class="fi">${favHTML(hostOf(u))}</span><span></span>`);$('span:last-child',a).textContent=n;a.onclick=()=>nav(t,u);favs.append(a)});
    t.el.append(s); if(t===cur)sync(); drawTabs();
  }
  function page(t,url,searchQ){
    t.url=url; t.el.innerHTML=''; t.title=searchQ?'Szukaj: '+searchQ:hostOf(url);
    if(searchQ){
      const c=el('div','browser-start',`<div style="text-align:center;max-width:420px"><h3 style="margin:0 0 8px"></h3><p style="color:var(--fg2)">Wyszukiwarka nie pozwala na osadzenie wyników w oknie. Otwórz je w nowej karcie.</p><a class="btn p" style="display:inline-block;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">Otwórz wyniki</a></div>`);
      $('h3',c).textContent='Wyszukaj „'+searchQ+'”'; t.el.append(c);
    }else{
      const n=el('div','status','Jeśli strona się nie wyświetla, jej serwer blokuje osadzanie. Użyj przycisku ↗ obok paska adresu.'); t.el.append(n,webFrame(url));
    }
    if(t===cur)sync(); drawTabs();
  }
  function nav(t,text,push=true){
    text=(text||'').trim(); if(!t)return; let u=null, q=null;
    if(text){
      const dd=/^https:\/\/duckduckgo\.com\/\?q=(.+)$/.exec(text);
      if(dd){q=decodeURIComponent(dd[1]);u=text}else if(/^https?:\/\//i.test(text))u=text; else if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(text))u='https://'+text; else{q=text;u='https://duckduckgo.com/?q='+encodeURIComponent(text)}
    }
    if(push){t.hist=t.hist.slice(0,t.hi+1);t.hist.push({u,q});t.hi=t.hist.length-1}
    if(!u)start(t);else page(t,u,q);
    sync();
  }
  function goHist(t,d){
    const i=t.hi+d; if(i<0||i>=t.hist.length)return; t.hi=i; const h=t.hist[i];
    if(!h)start(t);else page(t,h.u,h.q); sync();
  }
  addr.onkeydown=e=>{if(e.key==='Enter')nav(cur,addr.value)};
  back.onclick=()=>goHist(cur,-1); fw.onclick=()=>goHist(cur,1);
  rl.onclick=()=>{if(cur&&cur.url){const h=cur.hist[cur.hi];page(cur,h.u,h.q)}};
  w.menu=[['Nowa karta',()=>newTab(),'⌘T'],['Zamknij kartę',()=>{const d=$$('.btab',tabsBar)[tabs.indexOf(cur)];closeTab(cur,d)},'⌘W']];
  w.onopen=o=>{if(o.url)newTab(o.url)};
  newTab(opts&&opts.url);
}

const ANSI_COL={30:'#4a4a4f',31:'#ff6b6b',32:'#6fe28b',33:'#f5d76e',34:'#6aa9ff',35:'#d38bff',36:'#6fdde8',37:'#e5e5e7',90:'#8e8e93',91:'#ff8a80',92:'#9af5b0',93:'#ffe58f',94:'#8fbfff',95:'#e5acff',96:'#9aeaf2'};
function ansiHTML(s){
  let st={}, out='', last=0; const re=/\x1b\[([\d;]*)m/g; let m;
  const seg=t=>{if(!t)return;const css=(st.c?'color:'+st.c+';':'')+(st.b?'font-weight:700;':'')+(st.d?'opacity:.6;':'')+(st.u?'text-decoration:underline;':'')+(st.r?'background:var(--term-fg);color:var(--term-bg);':'');out+=css?`<span style="${css}">${esc(t)}</span>`:esc(t)};
  while((m=re.exec(s))){
    seg(s.slice(last,m.index)); last=re.lastIndex;
    (m[1]||'0').split(';').forEach(c=>{c=+c;if(c===0)st={};else if(c===1)st.b=1;else if(c===2)st.d=1;else if(c===4)st.u=1;else if(c===7)st.r=1;else if(ANSI_COL[c])st.c=ANSI_COL[c]});
  }
  seg(s.slice(last)); return out;
}

function renderTerm(body,w){
  const t=el('div','term'); body.append(t);
  let cwd=HOME, oldpwd=HOME, last=0, hist=store.get('thist',[]), hi=hist.length, busy=false, abort=false, pbuf=store.get('pbuf','');
  const env={HOME,USER:'gosc',LOGNAME:'gosc',SHELL:'/bin/zsh',PATH:'/usr/local/bin:/usr/bin:/bin',LANG:'pl_PL.UTF-8',TERM:'xterm-256color',EDITOR:'nano',HOSTNAME:'mgs',PWD:HOME};
  const line=el('div','ln','<span class="pr"></span><input aria-label="Polecenie" autocomplete="off" autocapitalize="off" spellcheck="false">'), inp=$('input',line), pr=$('.pr',line);
  const short=p=>p===HOME?'~':p.startsWith(HOME+'/')?'~'+p.slice(HOME.length):p;
  const setPrompt=()=>{pr.textContent=`gosc@mgs ${short(cwd)} % `;w.title(`gosc — zsh — ${short(cwd)}`);env.PWD=cwd};
  const abs=p=>VFS.norm(p,cwd);
  const out=(s,cls)=>{
    if(s==null||s==='')return; if(s.endsWith('\n'))s=s.slice(0,-1);
    const d=el('div',cls||'',ansiHTML(s)||'&nbsp;'); if(cls==='e')d.style.color='#ff8a80'; t.insertBefore(d,line);
  };
  const R=(o='',e='',c=0)=>({o,e,c});
  const eGet=k=>k==='?'?String(last):env[k]!=null?env[k]:'';
  const day=d=>d.toLocaleDateString('en-US',{weekday:'short'}), mon=d=>d.toLocaleDateString('en-US',{month:'short'});

  /* tokenizacja: cudzysłowy, zmienne, ~, operatory |, >, >>, ;, &&, || */
  function tokenize(s){
    const o=[]; let cur='', has=false, q=false;
    const push=()=>{if(has)o.push({t:'w',v:cur,q});cur='';has=false;q=false};
    const vr=/^\$(\{(\w+)\}|(\w+|\?))/;
    for(let i=0;i<s.length;i++){
      const c=s[i];
      if(c==="'"){q=true;has=true;i++;while(i<s.length&&s[i]!=="'")cur+=s[i++]}
      else if(c==='"'){
        q=true;has=true;i++;
        while(i<s.length&&s[i]!=='"'){
          if(s[i]==='\\'&&i+1<s.length&&'"$\\`'.includes(s[i+1])){cur+=s[i+1];i+=2;continue}
          if(s[i]==='$'){const m=vr.exec(s.slice(i));if(m){cur+=eGet(m[2]||m[3]);i+=m[0].length;continue}}
          cur+=s[i++];
        }
      }
      else if(c==='\\'){i++;if(i<s.length){cur+=s[i];has=true;q=true}}
      else if(c==='$'){const m=vr.exec(s.slice(i));if(m){cur+=eGet(m[2]||m[3]);has=true;i+=m[0].length-1}else{cur+=c;has=true}}
      else if(c==='~'&&!has&&(i+1>=s.length||/[\s/]/.test(s[i+1]))){cur+=HOME;has=true}
      else if(/\s/.test(c))push();
      else if(c==='|'||c===';'||c==='>'||c==='&'){
        push(); let op=c;
        if(c==='>'&&s[i+1]==='>'){op='>>';i++}else if(c==='&'&&s[i+1]==='&'){op='&&';i++}else if(c==='|'&&s[i+1]==='|'){op='||';i++}
        o.push({t:'op',v:op});
      }
      else if(c==='#'&&!has)break;
      else{cur+=c;has=true}
    }
    push(); return o;
  }
  function glob(tk){
    if(tk.q||!/[*?]/.test(tk.v))return[tk.v];
    const i=tk.v.lastIndexOf('/'), dir=i>=0?tk.v.slice(0,i+1):'', pat=tk.v.slice(i+1);
    const re=new RegExp('^'+pat.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');
    try{const m=VFS.list(abs(dir||'.')).map(x=>x[0]).filter(n=>re.test(n)&&(pat.startsWith('.')||!n.startsWith('.')));return m.length?m.map(n=>dir+n):[tk.v]}catch(e){return[tk.v]}
  }

  const readIn=(a,inp_,cmd)=>{ // czyta pliki lub stdin
    if(!a.length)return inp_!=null?{ok:inp_}:{ok:''};
    let s='',err='';
    for(const f of a){const n=VFS.get(abs(f));if(!n)err+=`${cmd}: ${f}: No such file or directory\n`;else if(n.t==='d')err+=`${cmd}: ${f}: Is a directory\n`;else s+=n.d||''}
    return{ok:s,err};
  };
  const flags=a=>{const f=new Set(),r=[];let end=false;for(const s of a){if(!end&&s==='--'){end=true;continue}if(!end&&/^-[A-Za-z]+$/.test(s))[...s.slice(1)].forEach(c=>f.add(c));else r.push(s)}return{f,r}};
  const lsLong=(name,n,x)=>{
    const d=new Date(n.m), when=mon(d)+' '+String(d.getDate()).padStart(2)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    const col=n.t==='d'?CL('1;34',name):n.k==='app'?CL(32,name):name;
    return `${n.t==='d'?'drwxr-xr-x':n.k==='app'?'-rwxr-xr-x':'-rw-r--r--'}  1 gosc  staff  ${String(VFS.size(n)).padStart(7)} ${when} ${x.tty?col:name}`;
  };
  function lsDir(p,disp,f,x,head){
    let l=VFS.list(p); if(!f.has('a'))l=l.filter(([k])=>!k.startsWith('.'));
    let o=head?disp+':\n':'';
    if(f.has('l'))o+=l.map(([k,n])=>lsLong(k,n,x)).join('\n')+(l.length?'\n':'');
    else o+=l.map(([k,n])=>x.tty?(n.t==='d'?CL('1;34',k):n.k==='app'?CL(32,k):k):k).join(f.has('1')?'\n':'  ')+(l.length?'\n':'');
    if(f.has('R'))l.forEach(([k,n])=>{if(n.t==='d')o+='\n'+lsDir(p+'/'+k,disp+'/'+k,f,x,true)});
